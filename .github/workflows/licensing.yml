# SPDX-License-Identifier: Apache-2.0
name: License boundaries
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:licenses
      - run: npm run build:core
      - run: npm run test:licenses
      - run: python3 tests/modular-release.py
      - run: python3 tests/provider-source-recovery.py
      - run: node --test tests/provider-conformance/asset-graph-contracts.mjs tests/provider-conformance/compiler-provenance-contracts.mjs
      - run: python3 tests/audio-source-policy.py
      - run: python3 tests/ci-slices.py
      - run: npm run build:components
      - run: node --test tests/component-selection.mjs tests/provider-resolution.mjs tests/provider-runtime.mjs tests/provider-acquisition.mjs tests/provider-container-metadata.mjs tests/codec-expansion-contracts.mjs tests/provider-owner-failures.mjs tests/provider-opus-roll.mjs
      - run: python3 tests/lgpl-closure.py
      - run: python3 tests/lgpl-catalogue.py
      - run: python3 tests/beta-release.py
      - run: python3 tests/npm-release.py
      - run: node --test tests/generated-runtime-files.mjs tests/beta-consumer-startup.mjs
      - run: node --test tests/head-to-head/initial-output.test.mjs
      - run: python3 tests/private-remux-assets.py
      - run: python3 tests/private-mpv-assets.py
      - run: python3 tests/private-playback-release.py
      - run: python3 tests/optional-release.py
      - run: node --test tests/remux-runtime.mjs tests/engine-preparation.mjs tests/private-remux.mjs tests/asset-deployment.mjs
      - run: node --test tests/fast-source-inspector.mjs tests/probe-requirements.mjs tests/native-selection.mjs tests/runtime-capability-contracts.mjs tests/file-reader.mjs tests/range-reader-deadline.mjs tests/remux-packaging-contracts.mjs tests/video-codec-config.mjs tests/progressive-mp4.mjs tests/remux-buffering.mjs tests/worker-remux-controller.mjs
      - name: Prepare the optional Shaka provider runtime
        run: npm run prepare:shaka
      - run: node --test tests/shaka-optional-build.mjs tests/shaka-assets.mjs tests/shaka-provider-runtime.mjs tests/shaka-backend.mjs tests/shaka-network.mjs tests/plan-admission.mjs tests/native-readiness-contracts.mjs tests/resource-loader.mjs tests/streaming-expansion.mjs
      - run: node --test tests/roadmap-contracts.mjs tests/track-policy.mjs tests/public-api-state.mjs tests/subtitle-overlay.mjs tests/subtitle-deadline-race.mjs
      - run: node --test tests/preview.mjs tests/preview-facade.mjs tests/preview-pregeneration.mjs tests/preview-range.mjs
      - run: node --test tests/native-seek-frame-race.mjs tests/private-mpv-eof-race.mjs tests/private-mpv-worker-errors.mjs
      - run: node --test tests/integration.mjs
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext tests/integration-types.ts
