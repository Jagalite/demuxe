# SPDX-License-Identifier: Apache-2.0
name: License boundaries
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check:licenses
      - run: npm run build:core
      - run: npm run test:licenses
      - run: python3 tests/beta-release.py
      - run: node --test tests/native-selection.mjs tests/runtime-capability-contracts.mjs tests/file-reader.mjs tests/range-reader-deadline.mjs tests/remux-packaging-contracts.mjs tests/video-codec-config.mjs tests/progressive-mp4.mjs tests/remux-buffering.mjs tests/worker-remux-controller.mjs
      - run: node --test tests/shaka-assets.mjs tests/shaka-backend.mjs tests/shaka-network.mjs tests/plan-admission.mjs tests/native-readiness-contracts.mjs tests/resource-loader.mjs tests/streaming-expansion.mjs
      - run: node --test tests/track-policy.mjs tests/public-api-state.mjs tests/subtitle-overlay.mjs
