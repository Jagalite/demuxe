name: Provider conformance harness
on:
  pull_request:
    paths:
      - 'tests/provider-conformance/**'
      - 'tests/provider-conformance-installed.mjs'
      - 'tests/provider-*.mjs'
      - 'tests/codec-expansion-page.mjs'
      - 'tests/codec-expansion-browser.mjs'
      - 'scripts/test-providers.mjs'
      - 'scripts/build-ci-reference.py'
      - '.github/actions/reference-tools/**'
      - 'sources.lock.json'
      - 'scripts/compile-component-providers.mjs'
      - 'src/internal/execution-capabilities.ts'
      - 'licensing/provider-packages.json'
      - 'packages/provider-container/**'
      - 'packages/provider-audio*/**'
      - 'packages/provider-ffmpeg*/**'
      - 'native/audio-codecs/**'
      - 'scripts/build-audio-providers.py'
      - 'scripts/build-opus-provider.py'
      - 'scripts/build-codec-preparation.py'
      - 'package*'
      - 'docs/PROVIDER-TESTING.md'
      - '.github/workflows/provider-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'tests/provider-conformance/**'
      - 'tests/provider-conformance-installed.mjs'
      - 'tests/provider-*.mjs'
      - 'tests/codec-expansion-page.mjs'
      - 'tests/codec-expansion-browser.mjs'
      - 'scripts/test-providers.mjs'
      - 'scripts/build-ci-reference.py'
      - '.github/actions/reference-tools/**'
      - 'sources.lock.json'
      - 'scripts/compile-component-providers.mjs'
      - 'src/internal/execution-capabilities.ts'
      - 'licensing/provider-packages.json'
      - 'packages/provider-container/**'
      - 'packages/provider-audio*/**'
      - 'packages/provider-ffmpeg*/**'
      - 'native/audio-codecs/**'
      - 'scripts/build-audio-providers.py'
      - 'scripts/build-opus-provider.py'
      - 'scripts/build-codec-preparation.py'
      - 'package*'
      - 'docs/PROVIDER-TESTING.md'
      - '.github/workflows/provider-conformance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Build pinned independent reference tools
        uses: ./.github/actions/reference-tools
      - name: Run contracts and installed provider checks
        run: npm run test:provider-harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-conformance-reports
          path: |
            build/provider-conformance*/**/*.json
            ${{ runner.temp }}/demuxe-reference-tools/reference-tools.json
          if-no-files-found: warn
