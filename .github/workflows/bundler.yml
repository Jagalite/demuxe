# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arm: [base, gl]
    env:
      MEDIA_ARM: ${{ matrix.arm }}
      DEBUG: pw:browser
      GST_DEBUG: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.0
      - run: npx playwright install --with-deps webkit
      - run: |
          sudo apt-get install -y ffmpeg pulseaudio gstreamer1.0-tools
          bash scripts/start-ci-audio.sh
          node tests/api-stability/fixtures.mjs
      - name: Add missing GL video sink dependency in the diagnostic arm
        if: matrix.arm == 'gl'
        run: sudo apt-get install -y gstreamer1.0-gl
      - name: Record actual system video decoders and sink availability
        run: |
          mkdir -p results/webkit-native-video
          gst-inspect-1.0 avdec_h264 > results/webkit-native-video/avdec_h264.txt
          gst-inspect-1.0 glimagesink > results/webkit-native-video/glimagesink.txt || true
      - name: Isolate browser native video decoding and seek without Demuxe
        run: node tests/webkit-native-video-isolation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-native-media-${{ matrix.arm }}
          path: results/webkit-native-video/
