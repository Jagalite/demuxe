name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specialist-host-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8542ccb79752d0e3869273ba09f91aa3158a0ae
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Reproduce the exact Dolby Vision reference command
        run: |
          python3 - <<'PY2'
          import pathlib,json,urllib.request,hashlib,subprocess
          out=pathlib.Path('evidence');out.mkdir()
          lock=json.load(open('tests/head-to-head/specialist-sources.json'))['sources']['dv5.mp4'];source=out/'source-dv5.mp4'
          with urllib.request.urlopen(lock['url'],timeout=120) as r:source.write_bytes(r.read())
          assert source.stat().st_size==lock['bytes'] and hashlib.sha256(source.read_bytes()).hexdigest()==lock['sha256']
          media=out/'dv5.mp4'
          cmd=['ffmpeg','-nostdin','-v','warning','-i',str(source),'-f','lavfi','-i','aevalsrc=0.15*sin(2*PI*440*t)|0.15*sin(2*PI*880*t):s=48000:d=36:c=stereo','-map','0:v:0','-map','1:a:0','-c:v','copy','-c:a','eac3','-b:a','384k','-t','36','-tag:v','hev1','-movflags','+faststart','-strict','unofficial',str(media)]
          p=subprocess.run(cmd,capture_output=True);(out/'prepare.stderr').write_bytes(p.stderr);p.check_returncode()
          (out/'version.txt').write_bytes(subprocess.check_output(['ffmpeg','-version']))
          cases=[]
          for trial in range(1,4):
              for target in [1,10]:
                  for variant in ['original','single-output-thread','single-decoder-and-output-thread']:
                      cmd=['ffmpeg','-nostdin','-v','error','-ss',str(target)]+(['-threads','1'] if variant=='single-decoder-and-output-thread' else [])+['-i',str(media),'-map','0:v:0','-frames:v','1','-an']+(['-threads:v','1'] if variant!='original' else [])+['-f','framemd5','-']
                      r=subprocess.run(cmd,capture_output=True,timeout=120);stem=str(trial)+'-'+str(target)+'-'+variant
                      (out/(stem+'.stdout')).write_bytes(r.stdout);(out/(stem+'.stderr')).write_bytes(r.stderr)
                      cases.append({'trial':trial,'target':target,'variant':variant,'command':cmd,'exit':r.returncode,'stderr':r.stderr.decode(errors='replace'),'frameRows':[l for l in r.stdout.decode(errors='replace').splitlines() if l and not l.startswith('#')]})
                      print(cases[-1],flush=True)
                      (out/'result.json').write_text(json.dumps({'fixtureSHA256':hashlib.sha256(media.read_bytes()).hexdigest(),'sourceSHA256':lock['sha256'],'cases':cases},indent=2))
          PY2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specialist-host-reference
          path: |
            evidence/result.json
            evidence/*.stderr
            evidence/*.stdout
            evidence/version.txt
