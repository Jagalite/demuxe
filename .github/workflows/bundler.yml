# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-archive:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, gate: matrix, node: '22'}
          - {os: macos-15, gate: webkit, node: '24'}
    env:
      HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8542ccb79752d0e3869273ba09f91aa3158a0ae
      - run: git rev-parse HEAD > "$RUNNER_TEMP/harness-revision.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: |
          npm ci --ignore-scripts
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          bash scripts/start-ci-audio.sh
          npm install --prefix "$RUNNER_TEMP/demuxe-linux-webkit" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/.bin/playwright" install --with-deps webkit
          printf 'DEMUXE_WEBKIT_TEST_MODULE=%s\n' "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - if: matrix.os == 'macos-15'
        run: |
          npx playwright install webkit
          command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release
          run-id: 38012356998
          github-token: ${{ github.token }}
      - name: Verify the immutable failed candidate
        run: |
          export BETA_ARCHIVE="$PWD/build/release/demuxe-1.1.1.tgz"
          printf 'BETA_ARCHIVE=%s\n' "$BETA_ARCHIVE" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {installLiveRuntime} from './tests/api-stability/live-runtime.mjs';
          const runtime=await installLiveRuntime(process.env.BETA_ARCHIVE);
          try {
            assert.equal(runtime.archiveSHA256,'4736a6477712e66d5a4166926e114edc765a464664839a3840d57323f964ce94');
            assert.equal(runtime.manifest.sourceCommit,'e8542ccb79752d0e3869273ba09f91aa3158a0ae');
            assert.equal(runtime.manifest.sourceTag,'v1.1.1');
            await mkdir('results/fixed-archive',{recursive:true});
            await writeFile('results/fixed-archive/identity.json',JSON.stringify({archiveSHA256:runtime.archiveSHA256,sourceCommit:runtime.manifest.sourceCommit,harnessRevision:await readFile(process.env.RUNNER_TEMP+'/harness-revision.txt','utf8'),consumerHarnessSHA256:createHash('sha256').update(await readFile('tests/public-api-consumer.mjs')).digest('hex'),platform:process.platform},null,2));
          } finally {await runtime.cleanup();}
          JS
      - name: Apply the single-module diagnostic overlay
        run: |
          python3 - <<'PY'
          import pathlib,tarfile,json,hashlib,io
          archive=pathlib.Path('build/release/demuxe-1.1.1.tgz');parent=hashlib.sha256(archive.read_bytes()).hexdigest();assert parent=='4736a6477712e66d5a4166926e114edc765a464664839a3840d57323f964ce94'
          name='package/web/generated/internal/machine/native-backend.js'
          with tarfile.open(archive) as tar:
              original=tar.extractfile(name).read();assert hashlib.sha256(original).hexdigest()=='8b8f7a3aa6cac842d927e6b7699682445419ca9c5f525e6a5b4e914bd1ab7684'
              updated=original.decode().replace("        const ready = facts.readyState >= (!verification.output && verification.metadataPreparation ? 1 : 3) && !facts.seeking && (!verification.active.video || facts.videoWidth > 0);","        // A paused HTTP seek may provide HAVE_CURRENT_DATA without buffering future\n        // frames. Preparation needs the current frame; executed output remains stricter.\n        const readyState = verification.output ? 3 : verification.metadataPreparation ? 1 : 2;\n        const ready = facts.readyState >= readyState && !facts.seeking && (!verification.active.video || facts.videoWidth > 0);").encode();assert hashlib.sha256(updated).hexdigest()=='dfc4510dbc294c2a956b62fce7d41e6cb4a42f0b34602791d9ed2ea97d4f807d'
              manifest=json.load(tar.extractfile('package/release-manifest.json'));manifest['files'][name.removeprefix('package/')]={'sha256':hashlib.sha256(updated).hexdigest(),'bytes':len(updated)}
              manifest['dirtySource']=True;manifest['sourceTag']=None;manifest['publicationEligible']=False;manifest['diagnosticOverlay']={'parentArchiveSHA256':parent,'file':name,'sourceSHA256':'4865cd4b31228619325831791d2e925a20b05602e73741d2ecdb6529c78833f8'}
              target=archive.with_suffix('.diagnostic.tgz')
              with tarfile.open(target,'w:gz') as output:
                  for member in tar:
                      data=tar.extractfile(member).read() if member.isfile() else None
                      if member.name==name:data=updated
                      if member.name=='package/release-manifest.json':data=(json.dumps(manifest,indent=2)+'\n').encode()
                      if data is not None:member.size=len(data)
                      output.addfile(member,io.BytesIO(data) if data is not None else None)
          target.replace(archive)
          pathlib.Path('results/fixed-archive/diagnostic-overlay.json').write_text(json.dumps({'parentArchiveSHA256':parent,'archiveSHA256':hashlib.sha256(archive.read_bytes()).hexdigest(),'fileSHA256':hashlib.sha256(updated).hexdigest(),'publicationEligible':False},indent=2)+'\n')
          print('Derived diagnostic archive: one generated readiness module changed; not a release candidate')
          PY
      - name: Prepare complete Linux release fixtures
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/prepare-release-fixtures.py
      - name: Prepare Apple WebKit API fixtures
        if: matrix.os == 'macos-15'
        run: node tests/api-stability/fixtures.mjs
      - name: Verify all installed archive API and mobile shards
        if: matrix.gate == 'matrix'
        run: |
          node tests/api-stability/archive-matrix.mjs
          for attempt in 1 2 3 4 5; do BROWSER=webkit node tests/player-mobile.mjs; done
          for attempt in 1 2; do BROWSER=chrome node tests/player-mobile.mjs; done
      - name: Verify Apple WebKit API, component, boundaries, containment and mobile
        if: matrix.gate == 'webkit'
        run: |
          node tests/webkit-release.mjs
          for attempt in 1 2 3; do BROWSER=webkit node tests/player-mobile.mjs; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-current-data-${{ matrix.gate }}
          path: |
            results/fixed-archive/
            results/passive-retirement/
            results/release-extra/
            results/public-api-consumer/
            results/public-api/
            results/player-component/
            results/player-menu-review/
            results/api-stability/
            results/player-mobile/
            results/webkit-release/
            results/worker-tree-containment/
