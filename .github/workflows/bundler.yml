# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-archive:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, gate: matrix, node: '22'}
    env:
      HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 61f395dddff65073883ff725a0ad7625ed74a2c0
      - run: git rev-parse HEAD > "$RUNNER_TEMP/harness-revision.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: |
          npm ci --ignore-scripts
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          bash scripts/start-ci-audio.sh
          npm install --prefix "$RUNNER_TEMP/demuxe-linux-webkit" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/.bin/playwright" install --with-deps webkit
          printf 'DEMUXE_WEBKIT_TEST_MODULE=%s\n' "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - if: matrix.os == 'macos-15'
        run: |
          npx playwright install webkit
          command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release
          run-id: 38025014110
          github-token: ${{ github.token }}
      - name: Verify the immutable failed candidate
        run: |
          export BETA_ARCHIVE="$PWD/build/release/demuxe-1.1.1.tgz"
          printf 'BETA_ARCHIVE=%s\n' "$BETA_ARCHIVE" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {installLiveRuntime} from './tests/api-stability/live-runtime.mjs';
          const runtime=await installLiveRuntime(process.env.BETA_ARCHIVE);
          try {
            assert.equal(runtime.archiveSHA256,'80264ec4edd0b5c8b3c22c48ac87ae9c6a0f314cb6252697cba4a7be7d77673b');
            assert.equal(runtime.manifest.sourceCommit,'61f395dddff65073883ff725a0ad7625ed74a2c0');
            assert.equal(runtime.manifest.sourceTag,'v1.1.1');
            await mkdir('results/fixed-archive',{recursive:true});
            await writeFile('results/fixed-archive/identity.json',JSON.stringify({archiveSHA256:runtime.archiveSHA256,sourceCommit:runtime.manifest.sourceCommit,harnessRevision:await readFile(process.env.RUNNER_TEMP+'/harness-revision.txt','utf8'),consumerHarnessSHA256:createHash('sha256').update(await readFile('tests/public-api-consumer.mjs')).digest('hex'),platform:process.platform},null,2));
          } finally {await runtime.cleanup();}
          JS
      - name: Compare MSE shutdown ordering on a diagnostic archive
        run: |
          python3 - <<'PY'
          import pathlib,tarfile,json,hashlib,io
          archive=pathlib.Path('build/release/demuxe-1.1.1.tgz');pathlib.Path('build/release/demuxe-parent.tgz').write_bytes(archive.read_bytes());parent=hashlib.sha256(archive.read_bytes()).hexdigest();assert parent=='80264ec4edd0b5c8b3c22c48ac87ae9c6a0f314cb6252697cba4a7be7d77673b'
          name='package/web/worker-remux-controller.js'
          with tarfile.open(archive) as tar:
              original=tar.extractfile(name).read();assert hashlib.sha256(original).hexdigest()=='c6bbdb8fcf275ac6d85f1263c97934c8dc1e3babe4007ce4822553a5b06a9f0c'
              before="await Promise.all([release,...this.releases.values(),acquisition]);await local?.destroy();this.video.pause();this.video.srcObject=null;this.video.removeAttribute('src');this.video.load();"
              after="this.video.pause();this.video.srcObject=null;this.video.removeAttribute('src');this.video.load();await Promise.all([release,...this.releases.values(),acquisition]);await local?.destroy();"
              assert original.decode().count(before)==1;updated=original.decode().replace(before,after).encode()
              manifest=json.load(tar.extractfile('package/release-manifest.json'));manifest['files'][name.removeprefix('package/')]={'sha256':hashlib.sha256(updated).hexdigest(),'bytes':len(updated)}
              manifest['dirtySource']=True;manifest['sourceTag']=None;manifest['publicationEligible']=False;manifest['diagnosticOverlay']={'parentArchiveSHA256':parent,'file':name,'change':'Detach media before waiting for MSE worker shutdown'}
              target=archive.with_suffix('.diagnostic.tgz')
              with tarfile.open(target,'w:gz') as output:
                  for member in tar:
                      data=tar.extractfile(member).read() if member.isfile() else None
                      if member.name==name:data=updated
                      if member.name=='package/release-manifest.json':data=(json.dumps(manifest,indent=2)+'\n').encode()
                      if data is not None:member.size=len(data)
                      output.addfile(member,io.BytesIO(data) if data is not None else None)
          target.replace(archive)
          pathlib.Path('results/fixed-archive/diagnostic-overlay.json').write_text(json.dumps({'parentArchiveSHA256':parent,'archiveSHA256':hashlib.sha256(archive.read_bytes()).hexdigest(),'publicationEligible':False},indent=2)+'\n')
          PY
      - name: Prepare complete Linux release fixtures
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/prepare-release-fixtures.py
      - name: Prepare Apple WebKit API fixtures
        if: matrix.os == 'macos-15'
        run: node tests/api-stability/fixtures.mjs
      - name: Repeat full consumer qualification without changing destroy timing
        run: |
          python3 - <<'PY'
          import pathlib,base64
          pathlib.Path('tests/beta-consumer.mjs').write_bytes(base64.b64decode(''))
          PY
          python3 - <<'PY'
          import subprocess,os,pathlib,json
          reports=[]
          for lane,archive,family,repeats in [('original','build/release/demuxe-parent.tgz','chrome',3),('early-detach','build/release/demuxe-1.1.1.tgz','chrome',3),('early-detach','build/release/demuxe-1.1.1.tgz','firefox',2)]:
              for repeat in range(repeats):
                  before=set(pathlib.Path('results/beta').glob('consumer-'+family+'-*/result.json'))
                  run=subprocess.run(['node','tests/beta-consumer.mjs'],env={**os.environ,'BETA_ARCHIVE':str(pathlib.Path(archive).resolve()),'BROWSER':family,'HEADLESS':'1','DEBUG':'pw:browser','ADAPTATION_FIXTURE':str(pathlib.Path('build/optimization-fixtures/long-pcm.mkv').resolve()),'AUTOMATIC_ADAPTATION_FIXTURE':str(pathlib.Path('build/optimization-fixtures/automatic-release.mkv').resolve())})
                  fresh=set(pathlib.Path('results/beta').glob('consumer-'+family+'-*/result.json'))-before;assert len(fresh)==1
                  report=json.loads(next(iter(fresh)).read_text());row={'lane':lane,'repeat':repeat,'family':family,'code':run.returncode,'report':str(next(iter(fresh))),'cases':[{k:c.get(k) for k in ['name','passed','cleanupMs','cleanupLimitMs','workersAfter','leftoverWorkerProbe','error']} for c in report['cases']]};reports.append(row)
                  pathlib.Path('results/mse-close-probe').mkdir(exist_ok=True);pathlib.Path('results/mse-close-probe/result.json').write_text(json.dumps(reports,indent=2)+'\n');print(json.dumps(row),flush=True)
          assert all(row['code']==0 for row in reports if row['lane']=='early-detach')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mse-close-unpolled-${{ matrix.gate }}
          path: |
            results/mse-close-probe/
            results/beta/
            results/fixed-archive/
            results/passive-retirement/
            results/release-extra/
            results/public-api-consumer/
            results/public-api/
            results/player-component/
            results/player-menu-review/
            results/api-stability/
            results/player-mobile/
            results/webkit-release/
            results/worker-tree-containment/
