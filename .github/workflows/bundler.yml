name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  catalogue-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: cp tests/head-to-head/validate-specialist-fixtures.py "$RUNNER_TEMP/validate-specialist-fixtures.py"
      - uses: actions/checkout@v4
        with:
          ref: e8542ccb79752d0e3869273ba09f91aa3158a0ae
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci --ignore-scripts
          npm run prepare:shaka
          cp "$RUNNER_TEMP/validate-specialist-fixtures.py" tests/head-to-head/validate-specialist-fixtures.py
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          /opt/google/chrome/chrome --version
          bash scripts/start-ci-audio.sh
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release
          run-id: 38012356998
          github-token: ${{ github.token }}
      - name: Verify the unchanged failed candidate archive
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,tarfile,json,shutil
          archive=pathlib.Path('build/release/demuxe-1.1.1.tgz');assert hashlib.sha256(archive.read_bytes()).hexdigest()=='4736a6477712e66d5a4166926e114edc765a464664839a3840d57323f964ce94'
          with tarfile.open(archive) as tar:
              manifest=json.load(tar.extractfile('package/release-manifest.json'));assert manifest['sourceCommit']=='e8542ccb79752d0e3869273ba09f91aa3158a0ae' and manifest['dirtySource'] is False
              for name,v in manifest['files'].items():assert hashlib.sha256(tar.extractfile('package/'+name).read()).hexdigest()==v['sha256'],name
              tar.extractall('build/catalogue-installed',filter='data')
          shutil.copytree('build/catalogue-installed/package/web','web',dirs_exist_ok=True)
          print('Diagnostic uses exact candidate bytes with a reference-validator overlay; no publication')
          PY
      - name: Inspect Chrome automation flags
        env:
          DEBUG: pw:browser
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          for (const args of [[],['--enable-automation']]) {
            const b=await chromium.launch({channel:'chrome',headless:true,args});
            try { const c=await b.newBrowserCDPSession(); console.log(JSON.stringify({args,command:await c.send('Browser.getBrowserCommandLine')})); }
            catch(e) { console.log(JSON.stringify({args,error:String(e)})); }
            finally {await b.close();}
          }
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/head-to-head/benchmark-browser.mjs')
          s=p.read_text().replace("export const launchArgs=['--autoplay-policy=no-user-gesture-required'];", "export const launchArgs=['--enable-automation','--autoplay-policy=no-user-gesture-required'];")
          p.write_text(s)
          PY
      - name: Validate all specialist fixtures and complete both catalogues
        run: |
          python3 - <<'PY'
          import importlib.util,pathlib
          spec=importlib.util.spec_from_file_location('tag_release','scripts/tag-release.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.fetch_baseline();baseline,assets=m.catalogue(pathlib.Path('build/release/demuxe-1.1.1.tgz').resolve());m.run_catalogue_correctness(baseline,assets)
          m.run(['python3','scripts/compare-lgpl-catalogue.py','--baseline',m.WORK/'baseline/summary.json','--candidate',m.WORK/'candidate/summary.json','--output',m.WORK/'catalogue-comparison.json'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-diagnostic
          path: |
            build/tag-release/catalogue-comparison.json
            build/tag-release/baseline/*.json
            build/tag-release/candidate/*.json
            build/tag-release/specialist-validation/*.json
            build/tag-release/specialist-validation/*/*.json
            build/tag-release/specialist-validation/*/*.framemd5
            build/tag-release/candidate-assets/commands.json
            build/tag-release/candidate-assets/specialist.json
            build/tag-release/candidate-assets/fixtures/specialist/commands.json
