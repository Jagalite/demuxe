name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-packet-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir evidence
          ffmpeg -v error -nostdin -n -f lavfi -i testsrc2=size=160x90:rate=30:duration=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=30 -c:v libx264 -preset veryfast -g 30 -bf 2 -c:a pcm_s24le -threads 2 evidence/original.mkv
          ffmpeg -v error -nostdin -n -i evidence/original.mkv -map 0 -c copy evidence/reinterleaved.mkv
          ffprobe -v error -show_packets -show_entries packet=stream_index,pts_time,dts_time,pos -of json evidence/original.mkv > evidence/original-packets.json
          ffprobe -v error -show_packets -show_entries packet=stream_index,pts_time,dts_time,pos -of json evidence/reinterleaved.mkv > evidence/reinterleaved-packets.json
          ffmpeg -version > evidence/version.txt
          python3 - <<'PY2'
          import json
          for name in ['original','reinterleaved']:
              packets=json.load(open('evidence/'+name+'-packets.json'))['packets']
              print(name,'video packets with preceding audio position')
              last=None
              for index,p in enumerate(packets):
                  if p['stream_index']==1:last=p.get('pts_time')
                  else: print(index,p,'precedingAudio',last)
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-packet-order
          path: evidence/
