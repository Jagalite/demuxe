# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-archive:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, gate: matrix, node: '22'}
    env:
      HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8542ccb79752d0e3869273ba09f91aa3158a0ae
      - run: git rev-parse HEAD > "$RUNNER_TEMP/harness-revision.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: |
          npm ci --ignore-scripts
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          bash scripts/start-ci-audio.sh
          npm install --prefix "$RUNNER_TEMP/demuxe-linux-webkit" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/.bin/playwright" install --with-deps webkit
          printf 'DEMUXE_WEBKIT_TEST_MODULE=%s\n' "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - if: matrix.os == 'macos-15'
        run: |
          npx playwright install webkit
          command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release
          run-id: 38012356998
          github-token: ${{ github.token }}
      - name: Verify the immutable failed candidate
        run: |
          export BETA_ARCHIVE="$PWD/build/release/demuxe-1.1.1.tgz"
          printf 'BETA_ARCHIVE=%s\n' "$BETA_ARCHIVE" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {installLiveRuntime} from './tests/api-stability/live-runtime.mjs';
          const runtime=await installLiveRuntime(process.env.BETA_ARCHIVE);
          try {
            assert.equal(runtime.archiveSHA256,'4736a6477712e66d5a4166926e114edc765a464664839a3840d57323f964ce94');
            assert.equal(runtime.manifest.sourceCommit,'e8542ccb79752d0e3869273ba09f91aa3158a0ae');
            assert.equal(runtime.manifest.sourceTag,'v1.1.1');
            await mkdir('results/fixed-archive',{recursive:true});
            await writeFile('results/fixed-archive/identity.json',JSON.stringify({archiveSHA256:runtime.archiveSHA256,sourceCommit:runtime.manifest.sourceCommit,harnessRevision:await readFile(process.env.RUNNER_TEMP+'/harness-revision.txt','utf8'),consumerHarnessSHA256:createHash('sha256').update(await readFile('tests/public-api-consumer.mjs')).digest('hex'),platform:process.platform},null,2));
          } finally {await runtime.cleanup();}
          JS
      - name: Prepare complete Linux release fixtures
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/prepare-release-fixtures.py
      - name: Prepare Apple WebKit API fixtures
        if: matrix.os == 'macos-15'
        run: node tests/api-stability/fixtures.mjs
      - name: Verify all installed archive API and mobile shards
        if: matrix.gate == 'matrix'
        run: |
          status=0
          for attempt in 1 2; do
            BROWSER=webkit node tests/player-mobile.mjs || status=1
          done
          exit "$status"
      - name: Verify Apple WebKit API, component, boundaries, containment and mobile
        if: matrix.gate == 'webkit'
        run: node tests/webkit-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-mobile-repeat
          path: |
            results/fixed-archive/
            results/passive-retirement/
            results/release-extra/
            results/public-api-consumer/
            results/public-api/
            results/player-component/
            results/player-menu-review/
            results/api-stability/
            results/player-mobile/
            results/webkit-release/
            results/worker-tree-containment/
