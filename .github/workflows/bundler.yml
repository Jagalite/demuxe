# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  owner-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit]
        arm: [trace, cancel-ack]
    env:
      BROWSER: ${{ matrix.browser }}
      OWNER_ARM: ${{ matrix.arm }}
      DEBUG: pw:browser
      BUNDLE_SOURCE_CANDIDATE: '1'
      BUNDLE_INVENTORY_SHA256: 727339585c74261a68c751f748dceb721bbb1c0e0f093720426cb46edb4c30af
      DEMUXE_RUNTIME_ROOT: build/bundle-flexibility/ci-assets/assets
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir "$RUNNER_TEMP/owner-fix"
          cp tests/worker-owner-diagnostic.mjs web/generated/internal/wasm-player.js "$RUNNER_TEMP/owner-fix/"
          git rev-parse HEAD > "$RUNNER_TEMP/owner-fix/revision.txt"
      - uses: actions/checkout@v4
        with:
          ref: fa05ccdf6055dec1e1f7c7447ec94e11c7c2b18e
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio
          bash scripts/start-ci-audio.sh
      - uses: actions/download-artifact@v4
        with:
          name: source-provider-browser-inputs
          path: build/bundle-ci-inputs
          run-id: 37918659239
          github-token: ${{ github.token }}
      - id: prepare
        run: |
          node scripts/prepare-bundle-ci.mjs
          if [ "$OWNER_ARM" != baseline ]; then cp "$RUNNER_TEMP/owner-fix/wasm-player.js" "$DEMUXE_RUNTIME_ROOT/web/generated/internal/"; fi
          cp "$RUNNER_TEMP/owner-fix/worker-owner-diagnostic.mjs" tests/
          python3 - <<'TRACE'
          import os,pathlib
          root=pathlib.Path(os.environ['DEMUXE_RUNTIME_ROOT']);file=root/'web/filter-retained-engine-worker.js';text=file.read_text()
          text=text.replace('await cleanAsync(closeIO);',"console.log('WORKER_STAGE', 'io-start',performance.now());await cleanAsync(closeIO);console.log('WORKER_STAGE','io-done',performance.now());")
          text=text.replace('clean(()=>engine?._web_destroy());',"console.log('WORKER_STAGE','native-start',performance.now(),JSON.stringify(Array.from(new Int32Array(engine.HEAPU8.buffer,engine._web_decoder_ptr(),4))));clean(()=>engine?._web_destroy());console.log('WORKER_STAGE','native-done',performance.now(),JSON.stringify(Array.from(new Int32Array(engine.HEAPU8.buffer,engine._web_decoder_ptr(),4))));")
          text=text.replace('clean(()=>engine?.PThread.terminateAllThreads());',"console.log('WORKER_STAGE','threads-done',performance.now());clean(()=>engine?.PThread.terminateAllThreads());")
          file.write_text(text)
          if os.environ['OWNER_ARM']=='cancel-ack':
            file=root/'web/retained-decoder-worker.js';text=file.read_text().replace("postMessage({stats:{...stats,outstanding:0,queued:0,active:false}});","postMessage({stats:{...stats,outstanding:0,queued:0,active:false}});postMessage({type:'cancelled'});");file.write_text(text)
            file=root/'web/filter-retained-engine-worker.js';text=file.read_text().replace("clean(()=>decoderWorker?.postMessage({type:'cancel'}));","await cleanAsync(()=>decoderWorker?new Promise((resolve,reject)=>{const worker=decoderWorker;let timer;const cancelled=({data})=>{if(data.type!=='cancelled')return;clearTimeout(timer);worker.removeEventListener('message',cancelled);console.log('WORKER_STAGE','decoder-cancelled',performance.now());resolve();};worker.addEventListener('message',cancelled);timer=setTimeout(()=>{worker.removeEventListener('message',cancelled);reject(Error('Decoder cancellation timed out'));},2000);worker.postMessage({type:'cancel'});}):undefined);");file.write_text(text)
          if False:
            file=root/'web/io-worker.js';text=file.read_text();text=text.replace('if((state&7)===1)continue;',"if((state&7)===1){await new Promise(resolve=>setTimeout(resolve,0));continue;}");file.write_text(text)
          TRACE
          node tests/api-stability/fixtures.mjs
          mkdir -p results/worker-owner
          cp "$RUNNER_TEMP/owner-fix/revision.txt" results/worker-owner/
          sha256sum "$DEMUXE_RUNTIME_ROOT/web/generated/internal/wasm-player.js" build/bundle-ci-inputs/bundle-ci-inventory.json > results/worker-owner/identities.txt
      - name: Stress production owner initialization through 80 subtitle and engine switch cycles
        run: |
          set -o pipefail
          node tests/worker-owner-diagnostic.mjs 2>&1 | tee results/worker-owner/browser.log
      - name: Verify public API and component transitions
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          node tests/public-api.mjs
          node tests/player-component.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoder-close-${{ matrix.arm }}
          path: |
            results/worker-owner/
            results/public-api/
            results/player-component/
