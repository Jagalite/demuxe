# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  owner-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [original, settled]
    env:
      BROWSER: chromium
      OWNER_ARM: ${{ matrix.arm }}
      DEBUG: pw:browser
      BUNDLE_SOURCE_CANDIDATE: '1'
      BUNDLE_INVENTORY_SHA256: 727339585c74261a68c751f748dceb721bbb1c0e0f093720426cb46edb4c30af
      DEMUXE_RUNTIME_ROOT: build/bundle-flexibility/ci-assets/assets
    steps:
      - uses: actions/checkout@v4
      - run: cp tests/worker-owner-diagnostic.mjs "$RUNNER_TEMP/"
      - uses: actions/checkout@v4
        with:
          ref: fa05ccdf6055dec1e1f7c7447ec94e11c7c2b18e
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio
          bash scripts/start-ci-audio.sh
      - uses: actions/download-artifact@v4
        with:
          name: source-provider-browser-inputs
          path: build/bundle-ci-inputs
          run-id: 37918659239
          github-token: ${{ github.token }}
      - run: node scripts/prepare-bundle-ci.mjs
      - run: node tests/api-stability/fixtures.mjs
      - name: Record the optional preloaded owner and logging overlay
        run: |
          mkdir -p results/worker-owner
          cp "$RUNNER_TEMP/worker-owner-diagnostic.mjs" tests/
          python3 - <<'PYCODE'
          import pathlib,hashlib,json
          root=pathlib.Path('build/bundle-flexibility/ci-assets/assets')
          file=root/'web/generated/internal/wasm-player.js'
          text=file.read_text();before=hashlib.sha256(file.read_bytes()).hexdigest()
          text=text.replace("this.workerOwner = document.createElement('iframe');", "this.workerOwner = globalThis.__diagnosticReadyOwners?.shift() ?? document.createElement('iframe');")
          text=text.replace('document.body.append(this.workerOwner);','if(!this.workerOwner.isConnected)document.body.append(this.workerOwner);')
          text=text.replace('const owner = this.workerOwner.contentWindow;', '''const owner = this.workerOwner.contentWindow;
          const ownerDoc = this.workerOwner.contentDocument;
          console.log('WORKER_OWNER_CREATE', JSON.stringify({ready:ownerDoc.readyState,isolated:owner.crossOriginIsolated,mode,settled:!!this.workerOwner.dataset.ownerSettled}));
          this.workerOwner.addEventListener('load',()=>console.log('WORKER_OWNER_LOAD',JSON.stringify({sameDocument:ownerDoc===this.workerOwner.contentDocument,mode})),{once:true});''')
          text=text.replace('this.worker.onerror = workerFailure;', '''this.worker.addEventListener('error',event=>console.error('WORKER_OWNER_ERROR',JSON.stringify({mode,type:event.type,message:event.message,filename:event.filename,ready:ownerDoc.readyState,sameDocument:ownerDoc===this.workerOwner.contentDocument,connected:this.workerOwner.isConnected})));
          this.worker.onerror = workerFailure;''')
          assert 'WORKER_OWNER_CREATE' in text and '__diagnosticReadyOwners?.shift()' in text
          file.write_text(text)
          pathlib.Path('results/worker-owner/overlay.json').write_text(json.dumps({'sourceCommit':'fa05ccdf6055dec1e1f7c7447ec94e11c7c2b18e','inventorySHA256':'727339585c74261a68c751f748dceb721bbb1c0e0f093720426cb46edb4c30af','before':before,'after':hashlib.sha256(file.read_bytes()).hexdigest(),'scope':'Diagnostic owner preloading and logging overlay; not release qualification'},indent=2))
          PYCODE
      - name: Stress exact source assets with original or settled owner startup
        run: |
          set -o pipefail
          node tests/worker-owner-diagnostic.mjs 2>&1 | tee results/worker-owner/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-owner-${{ matrix.arm }}
          path: results/worker-owner/
