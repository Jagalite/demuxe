# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-archive:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, gate: retirement, node: '22', chrome: system}
          - {os: ubuntu-24.04, gate: retirement, node: '22', chrome: installed}
    env:
      HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir "$RUNNER_TEMP/passive-harness"
          cp tests/public-api-consumer.mjs tests/player-component.mjs "$RUNNER_TEMP/passive-harness/"
          git rev-parse HEAD > "$RUNNER_TEMP/harness-revision.txt"
      - uses: actions/checkout@v4
        with:
          ref: 4b2222a18d25e6c24071bf24a2245dada36ce6ba
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: |
          npm ci --ignore-scripts
          cp "$RUNNER_TEMP/passive-harness/public-api-consumer.mjs" "$RUNNER_TEMP/passive-harness/player-component.mjs" tests/
      - if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 10
        run: |
          npx playwright install --with-deps chromium firefox
          if [ '${{ matrix.chrome }}' = installed ]; then npx playwright install chrome; fi
          node --input-type=module -e "import {chromium} from 'playwright';const b=await chromium.launch({channel:'chrome',headless:true});console.log('SYSTEM CHROME',b.version());await b.close();"
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          bash scripts/start-ci-audio.sh
      - if: matrix.os == 'macos-15'
        run: |
          npx playwright install webkit
          command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release
          run-id: 37983807474
          github-token: ${{ github.token }}
      - name: Verify the immutable failed candidate
        run: |
          export BETA_ARCHIVE="$PWD/build/release/demuxe-1.1.1.tgz"
          printf 'BETA_ARCHIVE=%s\n' "$BETA_ARCHIVE" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {installLiveRuntime} from './tests/api-stability/live-runtime.mjs';
          const runtime=await installLiveRuntime(process.env.BETA_ARCHIVE);
          try {
            assert.equal(runtime.archiveSHA256,'e767f0c71b175a97a1074690bf24670537aeb58c766dd2e2cfad746b19c72fed');
            assert.equal(runtime.manifest.sourceCommit,'4b2222a18d25e6c24071bf24a2245dada36ce6ba');
            assert.equal(runtime.manifest.sourceTag,'v1.1.1');
            await mkdir('results/fixed-archive',{recursive:true});
            await writeFile('results/fixed-archive/identity.json',JSON.stringify({archiveSHA256:runtime.archiveSHA256,sourceCommit:runtime.manifest.sourceCommit,harnessRevision:await readFile(process.env.RUNNER_TEMP+'/harness-revision.txt','utf8'),consumerHarnessSHA256:createHash('sha256').update(await readFile('tests/public-api-consumer.mjs')).digest('hex'),platform:process.platform},null,2));
          } finally {await runtime.cleanup();}
          JS
      - name: Prepare complete Linux release fixtures
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/prepare-release-fixtures.py
      - name: Prepare Apple WebKit API fixtures
        if: matrix.os == 'macos-15'
        run: node tests/api-stability/fixtures.mjs
      - name: Stress passive retirement and prove deliberate leaks are rejected
        if: matrix.gate == 'retirement'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {mkdirSync,writeFileSync} from 'node:fs';
          mkdirSync('results/passive-retirement',{recursive:true});const checks=[];
          for(const family of ['chrome'])for(let trial=0;trial<10;trial++){
            console.log('PASSIVE RETIREMENT TRIAL',family,trial+1);
            const run=spawnSync(process.execPath,['tests/public-api-consumer.mjs'],{env:{...process.env,BROWSER:family},encoding:'utf8',timeout:600000,maxBuffer:20*1024*1024});
            const log=(run.stdout||'')+(run.stderr||'');console.log(log);writeFileSync(`results/passive-retirement/${family}-${trial+1}.log`,log);
            checks.push({family,trial:trial+1,passed:run.status===0});writeFileSync('results/passive-retirement/result.json',JSON.stringify({checks},null,2));
          }
          for(const family of ['chrome']){
            const run=spawnSync(process.execPath,['tests/public-api-consumer.mjs'],{env:{...process.env,BROWSER:family,ONLY:'static application at /deep/runtime-v2/',RETIREMENT_NEGATIVE_CONTROL:'1'},encoding:'utf8',timeout:180000,maxBuffer:20*1024*1024});
            const log=(run.stdout||'')+(run.stderr||'');console.log(log);writeFileSync(`results/passive-retirement/${family}-negative.log`,log);
            const heartbeats=Number(log.match(/NEGATIVE LIVE HEARTBEATS (\d+)/)?.[1]);
            checks.push({family,negativeControl:true,exitCode:run.status,heartbeats,passed:run.status!==0&&log.includes('Workers still executing after destroy: blob:')&&heartbeats>50});
          }
          const passed=checks.length===11&&checks.every(row=>row.passed);writeFileSync('results/passive-retirement/result.json',JSON.stringify({checks,passed},null,2));assert.equal(passed,true);
          JS
      - name: Verify all extra release browser gates
        if: matrix.gate == 'extra'
        run: xvfb-run -a node tests/release-extra.mjs
      - name: Verify all installed archive API and mobile shards
        if: matrix.gate == 'matrix'
        run: node tests/api-stability/archive-matrix.mjs
      - name: Verify Apple WebKit API, component, boundaries, containment and mobile
        if: matrix.gate == 'webkit'
        run: node tests/webkit-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-fixed-${{ matrix.gate }}-${{ matrix.chrome }}
          path: |
            results/fixed-archive/
            results/passive-retirement/
            results/release-extra/
            results/public-api-consumer/
            results/public-api/
            results/player-component/
            results/player-menu-review/
            results/api-stability/
            results/player-mobile/
            results/webkit-release/
            results/worker-tree-containment/
