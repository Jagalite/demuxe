# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  component-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    env:
      BROWSER: firefox
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bea9b234e1a0ea13b77db7906b097e504545eb7e
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps firefox
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio
          bash scripts/start-ci-audio.sh
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/diagnostic-runtime
          run-id: 37897612923
          github-token: ${{ github.token }}
      - name: Verify and install the exact failed release archive
        run: |
          echo '3535aa9e63e25965f0216249be217d5cbafb5d8fa3b77c190939576ef9f4bff2  build/diagnostic-runtime/demuxe-1.1.1.tgz' | sha256sum -c -
          mkdir -p build/diagnostic-consumer results/component-diagnostic
          npm install --prefix build/diagnostic-consumer --offline --ignore-scripts --no-audit --no-fund "$PWD/build/diagnostic-runtime/demuxe-1.1.1.tgz"
          echo "DEMUXE_RUNTIME_ROOT=$PWD/build/diagnostic-consumer/node_modules/demuxe" >> "$GITHUB_ENV"
          python3 experiments/optimization-integration/fixtures.py
          sha256sum build/diagnostic-runtime/demuxe-1.1.1.tgz tests/player-component.mjs > results/component-diagnostic/identities.txt
      - name: Replay original component checks with browser stderr
        run: |
          set -o pipefail
          node tests/player-component.mjs 2>&1 | tee results/component-diagnostic/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-firefox-${{ matrix.repeat }}
          path: |
            results/component-diagnostic/
            results/player-component/
