# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tail-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - run: cp tests/unequal-tail-windows.mjs "$RUNNER_TEMP/unequal-tail-windows.mjs"
      - uses: actions/checkout@v4
        with:
          ref: d5781f8be49da77f9247f11fd686f6e19643c53d
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci --ignore-scripts
          cp "$RUNNER_TEMP/unequal-tail-windows.mjs" tests/unequal-tail-windows.mjs
          npx playwright install --with-deps chrome firefox
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          bash scripts/start-ci-audio.sh
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release
          run-id: 37999741973
          github-token: ${{ github.token }}
      - name: Verify and install the exact failed archive
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,tarfile,json
          archive=pathlib.Path('build/release/demuxe-1.1.1.tgz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='4e934eec21c254eb20a970edab6613b654d77f6228ad118db1b6406551cfe9a2'
          with tarfile.open(archive) as tar:
            manifest=json.load(tar.extractfile('package/release-manifest.json'))
            assert manifest['sourceCommit']=='d5781f8be49da77f9247f11fd686f6e19643c53d'
            for name,expected in manifest['files'].items():assert hashlib.sha256(tar.extractfile('package/'+name).read()).hexdigest()==expected['sha256'],name
            tar.extractall('build/tail-installed',filter='data')
          PY
          printf 'BETA_ARCHIVE=%s/build/release/demuxe-1.1.1.tgz\nDEMUXE_RUNTIME_ROOT=%s/build/tail-installed/package\nENGINE_BUILD=%s/build/tail-installed/package/web/engine-adaptation\n' "$PWD" "$PWD" "$PWD" >> "$GITHUB_ENV"
      - name: Prepare the same release fixtures
        run: python3 scripts/prepare-release-fixtures.py
      - name: Reproduce all tail cases with state and source-frame evidence
        env:
          BROWSER: ${{ matrix.browser }}
          SEEKS: '1'
          COMBINATION: '1'
          REMOTE: '1'
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';import {mkdirSync,writeFileSync,copyFileSync} from 'node:fs';
          mkdirSync('results/tail-diagnostic',{recursive:true});const checks=[];
          for(let trial=1;trial<=3;trial++){
            const run=spawnSync(process.execPath,['tests/unequal-tail-windows.mjs'],{env:process.env,encoding:'utf8',timeout:600000,maxBuffer:20*1024*1024});const log=(run.stdout||'')+(run.stderr||'');
            console.log(log);writeFileSync(`results/tail-diagnostic/${trial}.log`,log);
            const directory=log.match(/Evidence: (results\/optimization-final\/tail-controller-[^\s]+)/)?.[1];
            if(directory)copyFileSync(directory+'/result.json',`results/tail-diagnostic/${trial}.json`);
            checks.push({trial,passed:run.status===0,status:run.status,signal:run.signal,directory});writeFileSync('results/tail-diagnostic/summary.json',JSON.stringify({checks},null,2));
          }
          if(checks.some(c=>!c.passed))process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tail-diagnostic-${{ matrix.browser }}
          path: results/tail-diagnostic/
          if-no-files-found: error
