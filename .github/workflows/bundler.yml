# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  menu-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir "$RUNNER_TEMP/menu-diagnostic"
          cp tests/player-menu-review.mjs web/generated/player/index.js "$RUNNER_TEMP/menu-diagnostic/"
          git rev-parse HEAD > "$RUNNER_TEMP/menu-diagnostic/harness-commit.txt"
      - uses: actions/checkout@v4
        with:
          ref: 516debbb34f469c0ccc7f3e230d7c5d3dcfb089f
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          if [ "$BROWSER" = chrome ]; then npx playwright install --with-deps chrome chromium; else npx playwright install --with-deps "$BROWSER"; fi
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio
          bash scripts/start-ci-audio.sh
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/diagnostic-runtime
          run-id: 37907372451
          github-token: ${{ github.token }}
      - name: Verify exact failed archive and preserve overlay identities
        run: |
          echo '64296b5b94d9462c3be6779a58aad6a19a0ecda45b72ac119336b0a2f6076128  build/diagnostic-runtime/demuxe-1.1.1.tgz' | sha256sum -c -
          mkdir -p build/diagnostic-consumer results/menu-diagnostic
          npm install --prefix build/diagnostic-consumer --offline --ignore-scripts --no-audit --no-fund "$PWD/build/diagnostic-runtime/demuxe-1.1.1.tgz"
          echo "DEMUXE_RUNTIME_ROOT=$PWD/build/diagnostic-consumer/node_modules/demuxe" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/menu-diagnostic/"* results/menu-diagnostic/
          cp "$RUNNER_TEMP/menu-diagnostic/player-menu-review.mjs" tests/player-menu-review.mjs
          sha256sum build/diagnostic-runtime/demuxe-1.1.1.tgz build/diagnostic-consumer/node_modules/demuxe/web/generated/player/index.js results/menu-diagnostic/index.js tests/player-menu-review.mjs > results/menu-diagnostic/identities.txt
      - name: Negative control must reproduce mobile Escape focus failure
        run: |
          set +e
          node tests/player-menu-review.mjs > results/menu-diagnostic/negative-control.log 2>&1
          diagnostic_status=$?
          set -e
          test "$diagnostic_status" -ne 0
          grep -F 'Escape restores focus to a visible diagnostics entry point' results/menu-diagnostic/negative-control.log
          cp -r results/player-menu-review results/menu-diagnostic/negative-control-receipts
      - name: Verify desktop and mobile menus with the recorded focus overlay
        run: |
          cp "$RUNNER_TEMP/menu-diagnostic/index.js" "$DEMUXE_RUNTIME_ROOT/web/generated/player/index.js"
          set -o pipefail
          node tests/player-menu-review.mjs 2>&1 | tee results/menu-diagnostic/positive.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-focus-${{ matrix.browser }}
          path: |
            results/menu-diagnostic/
            results/player-menu-review/
