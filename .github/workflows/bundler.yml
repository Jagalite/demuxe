# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  remaining-archive:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, trial: linux}
          - {os: macos-15, trial: mac-1}
          - {os: macos-15, trial: mac-2}
          - {os: macos-15, trial: mac-3}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir "$RUNNER_TEMP/remaining-harness"
          cp tests/preview-software.mjs tests/player-mobile.mjs tests/webkit-release.mjs tests/player-menu-review.mjs tests/player-component.mjs tests/public-api.mjs "$RUNNER_TEMP/remaining-harness/"
          git rev-parse HEAD > "$RUNNER_TEMP/remaining-harness/revision.txt"
      - uses: actions/checkout@v4
        with:
          ref: 503b6d77385c833cd765b7434144a338f230a4fa
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: |
          npm ci --ignore-scripts
          cp "$RUNNER_TEMP/remaining-harness/preview-software.mjs" "$RUNNER_TEMP/remaining-harness/player-mobile.mjs" "$RUNNER_TEMP/remaining-harness/webkit-release.mjs" "$RUNNER_TEMP/remaining-harness/player-menu-review.mjs" "$RUNNER_TEMP/remaining-harness/player-component.mjs" "$RUNNER_TEMP/remaining-harness/public-api.mjs" tests/
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          npx playwright install --with-deps chromium chrome firefox webkit
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          bash scripts/start-ci-audio.sh
          npm install --prefix "$RUNNER_TEMP/demuxe-linux-webkit" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/.bin/playwright" install --with-deps webkit
          printf 'DEMUXE_WEBKIT_TEST_MODULE=%s\n' "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - if: matrix.os == 'macos-15'
        run: |
          npx playwright install webkit
          command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release
          run-id: 37959185053
          github-token: ${{ github.token }}
      - name: Verify the immutable archive and prepare fixtures
        run: |
          export BETA_ARCHIVE="$PWD/build/release/demuxe-1.1.1.tgz"
          printf 'BETA_ARCHIVE=%s\n' "$BETA_ARCHIVE" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile, mkdir, writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {installLiveRuntime} from './tests/api-stability/live-runtime.mjs';
          const runtime=await installLiveRuntime(process.env.BETA_ARCHIVE);
          try {
            assert.equal(runtime.archiveSHA256,'3beb3be9eb6101f884f6e8b349d8c97969cab21760a079f347519825a623810a');
            assert.equal(runtime.manifest.sourceCommit,'503b6d77385c833cd765b7434144a338f230a4fa');
            assert.equal(runtime.manifest.sourceTag,'v1.1.1');
            await mkdir('results/release-remaining',{recursive:true});
            await writeFile('results/release-remaining/identity.json',JSON.stringify({archiveSHA256:runtime.archiveSHA256,sourceCommit:runtime.manifest.sourceCommit,platform:process.platform},null,2));
          } finally {await runtime.cleanup();}
          JS
          node tests/api-stability/fixtures.mjs
      - name: Verify all menu layouts against the installed archive
        if: matrix.os == 'ubuntu-24.04'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {installLiveRuntime} from './tests/api-stability/live-runtime.mjs';
          const runtime=await installLiveRuntime(process.env.BETA_ARCHIVE);
          try {
            const result=spawnSync(process.execPath,['tests/player-menu-review.mjs'],{env:{...process.env,DEMUXE_RUNTIME_ROOT:runtime.runtimeRoot},stdio:'inherit',timeout:600000});
            assert.equal(result.status,0);
          } finally {await runtime.cleanup();}
          JS
      - name: Verify the complete installed API and mobile matrix
        if: matrix.os == 'ubuntu-24.04'
        run: node tests/api-stability/archive-matrix.mjs
      - name: Verify the installed Apple WebKit release gate
        if: matrix.os == 'macos-15'
        run: node tests/webkit-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-archive-${{ matrix.os }}-${{ matrix.trial }}
          path: |
            results/release-remaining/
            results/webkit-release/
            results/player-menu-review/
            results/api-stability/archive-matrix-*/
            results/api-stability/gate-browser-*/
            results/player-mobile/
            results/player-component/
            results/public-api/
