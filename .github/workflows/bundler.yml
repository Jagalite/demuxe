# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loader:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: mkdir -p build/bundle-flexibility
      - run: node --test tests/bundler.mjs tests/bundle-evidence.mjs tests/bundler-elements.mjs
      - run: node tests/bundler-browser.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-loader-${{ matrix.browser }}
          path: build/bundle-flexibility/browser-*/report.json
  providers:
    uses: ./.github/workflows/ci-providers.yml
  native:
    needs: providers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        delivery: [assets, embedded]
    env:
      BUNDLE_INVENTORY_SHA256: ${{ needs.providers.outputs.inventory_sha256 }}
      BUNDLE_SOURCE_CANDIDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: source-provider-browser-inputs
          path: build/bundle-ci-inputs
      - run: node scripts/prepare-bundle-ci.mjs
      - name: Exercise freshly built FFmpeg, Hybrid and atomic mpv
        env:
          BROWSER: ${{ matrix.browser }}
          BUNDLE_OUTPUT: build/bundle-flexibility/ci-${{ matrix.delivery }}
        run: |
          export BUNDLE_CASES="$(cat build/bundle-flexibility/ci-cases.json)"
          node tests/bundle-playback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-bundle-${{ matrix.browser }}-${{ matrix.delivery }}
          path: |
            build/bundle-flexibility/ci-*/bundle-manifest.json
            build/bundle-flexibility/ci-*/playback-*.json
            build/bundle-ci-consumer/candidate-admission.json
