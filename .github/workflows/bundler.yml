# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-archive:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, gate: retirement, node: '22'}
          - {os: ubuntu-24.04, gate: extra, node: '22'}
          - {os: ubuntu-24.04, gate: matrix, node: '22'}
          - {os: macos-15, gate: webkit, node: '24'}
    env:
      HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir "$RUNNER_TEMP/mse-owner"
          cp tests/public-api-consumer.mjs tests/worker-remux-controller.mjs tests/experimental-mse-archive.py "$RUNNER_TEMP/mse-owner/"
          cp web/worker-remux-controller.js "$RUNNER_TEMP/mse-owner/"
          git rev-parse HEAD > "$RUNNER_TEMP/harness-revision.txt"
      - uses: actions/checkout@v4
        with:
          ref: 4b2222a18d25e6c24071bf24a2245dada36ce6ba
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: |
          npm ci --ignore-scripts
          cp "$RUNNER_TEMP/mse-owner/public-api-consumer.mjs" "$RUNNER_TEMP/mse-owner/worker-remux-controller.mjs" "$RUNNER_TEMP/mse-owner/experimental-mse-archive.py" tests/
          cp "$RUNNER_TEMP/mse-owner/worker-remux-controller.js" web/
          node --test tests/worker-remux-controller.mjs
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          npx playwright install --with-deps chromium chrome firefox webkit
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          bash scripts/start-ci-audio.sh
          npm install --prefix "$RUNNER_TEMP/demuxe-linux-webkit" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/.bin/playwright" install --with-deps webkit
          printf 'DEMUXE_WEBKIT_TEST_MODULE=%s\n' "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - if: matrix.os == 'macos-15'
        run: |
          npx playwright install webkit
          command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release
          run-id: 37983807474
          github-token: ${{ github.token }}
      - name: Verify the immutable failed candidate
        run: |
          export BETA_ARCHIVE="$PWD/build/release/demuxe-1.1.1.tgz"
          printf 'BETA_ARCHIVE=%s\n' "$BETA_ARCHIVE" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {installLiveRuntime} from './tests/api-stability/live-runtime.mjs';
          const runtime=await installLiveRuntime(process.env.BETA_ARCHIVE);
          try {
            assert.equal(runtime.archiveSHA256,'e767f0c71b175a97a1074690bf24670537aeb58c766dd2e2cfad746b19c72fed');
            assert.equal(runtime.manifest.sourceCommit,'4b2222a18d25e6c24071bf24a2245dada36ce6ba');
            assert.equal(runtime.manifest.sourceTag,'v1.1.1');
            await mkdir('results/fixed-archive',{recursive:true});
            await writeFile('results/fixed-archive/identity.json',JSON.stringify({archiveSHA256:runtime.archiveSHA256,sourceCommit:runtime.manifest.sourceCommit,harnessRevision:await readFile(process.env.RUNNER_TEMP+'/harness-revision.txt','utf8'),consumerHarnessSHA256:createHash('sha256').update(await readFile('tests/public-api-consumer.mjs')).digest('hex'),platform:process.platform},null,2));
          } finally {await runtime.cleanup();}
          JS
      - name: Assemble the explicitly dirty MSE ownership experiment
        run: |
          python3 tests/experimental-mse-archive.py
          printf 'BETA_ARCHIVE=%s\n' "$PWD/build/release/demuxe-1.1.1-mse-owner-experiment.tgz" >> "$GITHUB_ENV"
      - name: Compare original and page-owned MSE teardown
        if: matrix.gate == 'retirement'
        run: |
          python3 scripts/prepare-release-fixtures.py
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync,mkdirSync} from 'node:fs';
          import path from 'node:path';
          const comparisons=[];mkdirSync('results/mse-owner-comparison',{recursive:true});
          let candidateFailures=0;
          for(let trial=0;trial<5;trial++)for(const kind of ['original','page-owned']){
            const archive=kind==='original'?path.resolve('build/release/demuxe-1.1.1.tgz'):process.env.BETA_ARCHIVE;
            console.log('MSE OWNER COMPARISON',trial+1,kind);
            const result=spawnSync(process.execPath,['tests/public-api-consumer.mjs'],{env:{...process.env,BETA_ARCHIVE:archive,BROWSER:'chrome',DEBUG:'pw:browser'},encoding:'utf8',timeout:600000,maxBuffer:20*1024*1024});
            const log=(result.stdout||'')+(result.stderr||'');
            console.log(log);
            writeFileSync(`results/mse-owner-comparison/${trial+1}-${kind}.log`,log);
            comparisons.push({trial:trial+1,kind,passed:result.status===0,status:result.status,archive});
            writeFileSync('results/mse-owner-comparison/result.json',JSON.stringify({comparisons,candidateFailures},null,2));
            if(kind==='page-owned'&&result.status!==0)candidateFailures++;
          }
          writeFileSync('results/mse-owner-comparison/result.json',JSON.stringify({comparisons,candidateFailures,passed:candidateFailures===0},null,2));
          process.exitCode=candidateFailures?1:0;
          JS
      - name: Prepare complete Linux release fixtures
        if: matrix.os == 'ubuntu-24.04' && matrix.gate != 'retirement'
        run: python3 scripts/prepare-release-fixtures.py
      - name: Prepare Apple WebKit API fixtures
        if: matrix.os == 'macos-15'
        run: node tests/api-stability/fixtures.mjs
      - name: Verify all extra release browser gates
        if: matrix.gate == 'extra'
        run: xvfb-run -a node tests/release-extra.mjs
      - name: Verify all installed archive API and mobile shards
        if: matrix.gate == 'matrix'
        run: node tests/api-stability/archive-matrix.mjs
      - name: Verify Apple WebKit API, component, boundaries, containment and mobile
        if: matrix.gate == 'webkit'
        run: node tests/webkit-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-fixed-${{ matrix.gate }}
          path: |
            results/fixed-archive/
            results/mse-owner-comparison/
            results/release-extra/
            results/public-api-consumer/
            results/public-api/
            results/player-component/
            results/player-menu-review/
            results/api-stability/
            results/player-mobile/
            results/webkit-release/
            results/worker-tree-containment/
