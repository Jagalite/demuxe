# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        owner: [page, blank, blob, network, srcdoc]
    env:
      BROWSER: ${{ matrix.browser }}
      TREE_OWNER: ${{ matrix.owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/worker-owner-grace-containment.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grace-owner-${{ matrix.browser }}-${{ matrix.owner }}
          path: results/worker-tree-containment/
