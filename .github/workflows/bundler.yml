# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          bash scripts/start-ci-audio.sh
      - name: Compare destination assignment with preservation of its existing layout
        run: |
          node --input-type=module <<'JS'
          import {chromium,firefox,webkit} from 'playwright';
          import http from 'node:http';
          import {writeFile} from 'node:fs/promises';
          const server=http.createServer((req,res)=>{res.writeHead(200,{'Content-Type':'text/html','Cross-Origin-Opener-Policy':'same-origin','Cross-Origin-Embedder-Policy':'require-corp'});res.end('<button>Activate</button>');});
          await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
          const browser=await({chromium,firefox,webkit}[process.env.BROWSER]).launch({headless:true});
          try{
            const page=await browser.newPage();await page.goto('http://127.0.0.1:'+server.address().port);await page.locator('button').click();
            const rows=await page.evaluate(async()=>{
              const rows=[];
              for(const guarded of [false,true]){
                const context=new AudioContext({latencyHint:'interactive'}),destination=context.destination;
                const row={guarded,maximum:destination.maxChannelCount,initialChannels:destination.channelCount};
                try{
                  if(!guarded||destination.channelCount!==2)destination.channelCount=2;
                  destination.channelCountMode='explicit';
                  const url=URL.createObjectURL(new Blob(['class Probe extends AudioWorkletProcessor{process(){return true}} registerProcessor("probe",Probe);'],{type:'text/javascript'}));
                  try{await context.audioWorklet.addModule(url);}finally{URL.revokeObjectURL(url);}
                  const node=new AudioWorkletNode(context,'probe',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2],channelCount:2,channelCountMode:'explicit'});
                  node.connect(destination);await context.resume();row.connected=true;row.finalChannels=destination.channelCount;node.disconnect();
                }catch(error){row.error=String(error);}
                finally{await context.close();row.closed=context.state==='closed';}
                rows.push(row);
              }
              return rows;
            });
            const report={browser:process.env.BROWSER,version:browser.version(),rows};console.log(JSON.stringify(report,null,2));await writeFile('audio-diagnosis.json',JSON.stringify(report,null,2));
            if(rows.some(row=>!row.closed)||!rows[1].connected)process.exitCode=1;
          }finally{await browser.close();server.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-diagnosis-${{ matrix.browser }}
          path: audio-diagnosis.json
