# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
      BUNDLE_SOURCE_CANDIDATE: '1'
      DEMUXE_RUNTIME_ROOT: build/bundle-flexibility/ci-assets/assets
    steps:
      - uses: actions/checkout@v4
      - name: Preserve corrected runtime and diagnostic harness
        run: |
          mkdir "$RUNNER_TEMP/audio-guard"
          cp web/generated/internal/wasm-player.js web/generated/internal/private-software-player.js tests/api-stability/audio-guard-diagnostic.mjs "$RUNNER_TEMP/audio-guard/"
          git rev-parse HEAD > "$RUNNER_TEMP/audio-guard/harness-commit.txt"
      - uses: actions/checkout@v4
        with:
          ref: 612542a4775ab41dd78bf2c10551e5fa8c1742a8
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio
          bash scripts/start-ci-audio.sh
      - uses: actions/download-artifact@v4
        with:
          name: source-provider-browser-inputs
          path: build/bundle-ci-inputs
          run-id: 37873088630
          github-token: ${{ github.token }}
      - name: Verify provider identity and install recorded audio guard overlay
        run: |
          export BUNDLE_INVENTORY_SHA256=9d75cc8479217effd7c6346547e94c366f6b6c6285d8158e210424b0e7ee34e7
          node scripts/prepare-bundle-ci.mjs
          cp "$RUNNER_TEMP/audio-guard/wasm-player.js" "$RUNNER_TEMP/audio-guard/private-software-player.js" "$DEMUXE_RUNTIME_ROOT/web/generated/internal/"
          cp "$RUNNER_TEMP/audio-guard/audio-guard-diagnostic.mjs" tests/api-stability/
          node tests/api-stability/fixtures.mjs
          mkdir -p results/audio-guard-diagnostic
          cp "$RUNNER_TEMP/audio-guard/harness-commit.txt" results/audio-guard-diagnostic/
          sha256sum "$DEMUXE_RUNTIME_ROOT/web/generated/internal/wasm-player.js" "$DEMUXE_RUNTIME_ROOT/web/generated/internal/private-software-player.js" build/bundle-ci-inputs/bundle-ci-inventory.json > results/audio-guard-diagnostic/identities.txt
      - name: Run unchanged live boundary scenarios against the diagnostic candidate
        run: node tests/api-stability/audio-guard-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-guard-boundaries-${{ matrix.browser }}
          path: |
            results/audio-guard-diagnostic/
            results/api-stability/live-boundaries/
            build/bundle-ci-consumer/candidate-admission.json
