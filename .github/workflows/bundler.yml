# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tail-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: firefox, variant: fixed-fixtures}
          - {browser: chrome, variant: fixed-fixtures}
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp tests/unequal-tail-windows.mjs "$RUNNER_TEMP/unequal-tail-windows.mjs"
          cp tests/beta-consumer.mjs "$RUNNER_TEMP/beta-consumer.mjs"
          cp scripts/tail-candidate-patch.py "$RUNNER_TEMP/tail-candidate-patch.py"
      - uses: actions/checkout@v4
        with:
          ref: d5781f8be49da77f9247f11fd686f6e19643c53d
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci --ignore-scripts
          cp "$RUNNER_TEMP/unequal-tail-windows.mjs" tests/unequal-tail-windows.mjs
          cp "$RUNNER_TEMP/beta-consumer.mjs" tests/beta-consumer.mjs
          if [ '${{ matrix.browser }}' = firefox ]; then
            npx playwright install --with-deps firefox
          else
            npx playwright install --with-deps chromium
            /opt/google/chrome/chrome --version
          fi
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          bash scripts/start-ci-audio.sh
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release
          run-id: 37999741973
          github-token: ${{ github.token }}
      - name: Verify and install the exact failed archive
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,tarfile,json
          archive=pathlib.Path('build/release/demuxe-1.1.1.tgz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='4e934eec21c254eb20a970edab6613b654d77f6228ad118db1b6406551cfe9a2'
          with tarfile.open(archive) as tar:
            manifest=json.load(tar.extractfile('package/release-manifest.json'))
            assert manifest['sourceCommit']=='d5781f8be49da77f9247f11fd686f6e19643c53d'
            for name,expected in manifest['files'].items():assert hashlib.sha256(tar.extractfile('package/'+name).read()).hexdigest()==expected['sha256'],name
            tar.extractall('build/tail-installed',filter='data')
          PY
          printf 'BETA_ARCHIVE=%s/build/release/demuxe-1.1.1.tgz\nDEMUXE_RUNTIME_ROOT=%s/build/tail-installed/package\nENGINE_BUILD=%s/build/tail-installed/package/web/engine-adaptation\n' "$PWD" "$PWD" "$PWD" >> "$GITHUB_ENV"
      - name: Apply the declared diagnostic runtime patch
        if: matrix.variant == 'candidate'
        run: python3 "$RUNNER_TEMP/tail-candidate-patch.py"
      - name: Prepare the same release fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('experiments/optimization-integration/fixtures.py');s=p.read_text();old="'-c:a','pcm_s24le','-threads','2',str(path)";assert s.count(old)==1;s=s.replace(old,"'-c:a','pcm_s24le','-threads','2','-max_interleave_delta','0',str(path)");p.write_text(s)
          PY
          python3 scripts/prepare-release-fixtures.py
          ffprobe -v error -show_packets -show_entries packet=stream_index,pts_time -of json build/optimization-fixtures/audio-tail.mkv > build/tail-packet-order.json
          python3 - <<'PY'
          import json
          p=json.load(open('build/tail-packet-order.json'))['packets'];audio=0
          for x in p:
              if x['stream_index']==1:audio=float(x['pts_time'])
              else: assert audio <= float(x['pts_time'])+.25,(x,audio)
          print('All short video packets precede their playback deadline')
          PY
      - name: Run all optional browser groups on the unchanged archive
        env:
          BROWSER: ${{ matrix.browser }}
          SEEKS: '1'
          COMBINATION: '1'
          REMOTE: '1'
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';import {mkdirSync,writeFileSync} from 'node:fs';
          mkdirSync('results/tail-diagnostic',{recursive:true});
          const allGroups=[
            ['consumer','tests/beta-consumer.mjs',{CASES:'automatic-local,automatic-lossless,hybrid-pin,software-pin,native-remux,native-external-ass,native-adaptation,native-opus,native-adaptation-ass-gain'}],
            ['presentation','tests/player-presentation.mjs',{}],
            ['external-subtitles','tests/mpv-external-subtitles.mjs',{}],
            ['automatic','tests/automatic-adaptation.mjs',{}],
            ['fractional-seek','tests/native-fractional-seek.mjs',{}],
            ['ass','tests/native-ass.mjs',{}],
            ['ass-selection','tests/native-ass-selection-regressions.mjs',{}],
            ['ass-style','tests/native-ass-style-regressions.mjs',{}],
            ['flac','tests/audio-adaptation.mjs',{CASES:'original-edge,multi-audio'}],
            ['opus','tests/audio-adaptation.mjs',{PROFILE:'opus',CASES:'original-edge,opus-multi-audio'}],
            ['lifecycle-flac','tests/audio-adaptation-lifecycle.mjs',{CASES:'bounded-local-gain,authenticated-range,destroy-blocked-read,incorrect-range'}],
            ['lifecycle-opus','tests/audio-adaptation-lifecycle.mjs',{PROFILE:'opus',CASES:'bounded-local-gain,authenticated-range,destroy-blocked-read,incorrect-range'}],
            ['gain','tests/in-place-gain.mjs',{}],
            ['unequal-tails','tests/unequal-tail-windows.mjs',{SEEKS:'1',COMBINATION:'1',REMOTE:'1'}]
          ];
          const groups=[['consumer-worker-assets','tests/beta-consumer.mjs',{CASES:'software-pin,rgb-override'}]];
          const record={archiveSHA256:'4e934eec21c254eb20a970edab6613b654d77f6228ad118db1b6406551cfe9a2',sourceCommit:'d5781f8be49da77f9247f11fd686f6e19643c53d',scope:'Diagnostic browser preflight with corrected fixture and seek harness; no source audit or release promotion',checks:[]};
          for(const [name,script,extra] of groups){
            const env={...process.env,ADAPTATION_FIXTURE:'build/optimization-fixtures/long-pcm.mkv',AUTOMATIC_ADAPTATION_FIXTURE:'build/optimization-fixtures/automatic-release.mkv'};
            for(const k of ['CASES','PROFILE','SEEKS','COMBINATION','REMOTE'])delete env[k];
            const begun=Date.now();const run=spawnSync(process.execPath,[script],{env:{...env,...extra},encoding:'utf8',timeout:600000,maxBuffer:20*1024*1024});const log=(run.stdout||'')+(run.stderr||'');
            console.log(name,run.status===0?'PASS':'FAIL',log);writeFileSync(`results/tail-diagnostic/${name}.log`,log);
            record.checks.push({name,script,passed:run.status===0,status:run.status,signal:run.signal,seconds:(Date.now()-begun)/1000});record.passed=record.checks.every(c=>c.passed);writeFileSync('results/tail-diagnostic/summary.json',JSON.stringify(record,null,2));
            if(run.status!==0){process.exitCode=1;break;}
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-worker-assets-${{ matrix.browser }}
          path: |
            results/tail-diagnostic/
            results/beta/
            results/optimization-final/
          if-no-files-found: error
