# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  remaining-archive:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, trial: linux}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir "$RUNNER_TEMP/remaining-harness"
          cp tests/preview-software.mjs tests/player-mobile.mjs tests/webkit-release.mjs tests/player-menu-review.mjs tests/player-component.mjs tests/public-api.mjs tests/public-api-consumer.mjs "$RUNNER_TEMP/remaining-harness/"
          git rev-parse HEAD > "$RUNNER_TEMP/remaining-harness/revision.txt"
      - uses: actions/checkout@v4
        with:
          ref: 4b2222a18d25e6c24071bf24a2245dada36ce6ba
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: |
          npm ci --ignore-scripts
          cp "$RUNNER_TEMP/remaining-harness/preview-software.mjs" "$RUNNER_TEMP/remaining-harness/player-mobile.mjs" "$RUNNER_TEMP/remaining-harness/webkit-release.mjs" "$RUNNER_TEMP/remaining-harness/player-menu-review.mjs" "$RUNNER_TEMP/remaining-harness/player-component.mjs" "$RUNNER_TEMP/remaining-harness/public-api.mjs" "$RUNNER_TEMP/remaining-harness/public-api-consumer.mjs" tests/
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          npx playwright install --with-deps chromium chrome firefox webkit
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          bash scripts/start-ci-audio.sh
          npm install --prefix "$RUNNER_TEMP/demuxe-linux-webkit" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/.bin/playwright" install --with-deps webkit
          printf 'DEMUXE_WEBKIT_TEST_MODULE=%s\n' "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - if: matrix.os == 'macos-15'
        run: |
          npx playwright install webkit
          command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release
          run-id: 37983807474
          github-token: ${{ github.token }}
      - name: Verify the immutable archive and prepare fixtures
        run: |
          export BETA_ARCHIVE="$PWD/build/release/demuxe-1.1.1.tgz"
          printf 'BETA_ARCHIVE=%s\n' "$BETA_ARCHIVE" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile, mkdir, writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {installLiveRuntime} from './tests/api-stability/live-runtime.mjs';
          const runtime=await installLiveRuntime(process.env.BETA_ARCHIVE);
          try {
            assert.equal(runtime.archiveSHA256,'e767f0c71b175a97a1074690bf24670537aeb58c766dd2e2cfad746b19c72fed');
            assert.equal(runtime.manifest.sourceCommit,'4b2222a18d25e6c24071bf24a2245dada36ce6ba');
            assert.equal(runtime.manifest.sourceTag,'v1.1.1');
            await mkdir('results/release-remaining',{recursive:true});
            await writeFile('results/release-remaining/identity.json',JSON.stringify({archiveSHA256:runtime.archiveSHA256,sourceCommit:runtime.manifest.sourceCommit,platform:process.platform},null,2));
          } finally {await runtime.cleanup();}
          JS
          python3 scripts/prepare-release-fixtures.py
      - name: Measure consumer worker retirement on the exact failed archive
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          let failures=0;
          for(let trial=0;trial<10;trial++){
            console.log('CONSUMER RETIREMENT TRIAL',trial+1);
            const result=spawnSync(process.execPath,['tests/public-api-consumer.mjs'],{env:{...process.env,BROWSER:'chrome',ONLY:'static application at /deep/runtime-v2/'},stdio:'inherit',timeout:180000});
            if(result.status!==0)failures++;
          }
          console.log('RETIREMENT BASELINE FAILURES',failures);
          process.exitCode=failures?1:0;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-archive-${{ matrix.os }}-${{ matrix.trial }}
          path: |
            results/release-remaining/
            results/webkit-release/
            results/player-menu-review/
            results/api-stability/archive-matrix-*/
            results/api-stability/gate-browser-*/
            results/player-mobile/
            results/player-component/
            results/public-api/
            results/public-api-consumer/
