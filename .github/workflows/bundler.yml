# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-archive:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, gate: matrix, node: '22'}
          - {os: macos-15, gate: webkit, node: '24'}
    env:
      HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8542ccb79752d0e3869273ba09f91aa3158a0ae
      - run: git rev-parse HEAD > "$RUNNER_TEMP/harness-revision.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: |
          npm ci --ignore-scripts
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          bash scripts/start-ci-audio.sh
          npm install --prefix "$RUNNER_TEMP/demuxe-linux-webkit" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/.bin/playwright" install --with-deps webkit
          printf 'DEMUXE_WEBKIT_TEST_MODULE=%s\n' "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - if: matrix.os == 'macos-15'
        run: |
          npx playwright install webkit
          command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release
          run-id: 38012356998
          github-token: ${{ github.token }}
      - name: Verify the immutable failed candidate
        run: |
          export BETA_ARCHIVE="$PWD/build/release/demuxe-1.1.1.tgz"
          printf 'BETA_ARCHIVE=%s\n' "$BETA_ARCHIVE" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {installLiveRuntime} from './tests/api-stability/live-runtime.mjs';
          const runtime=await installLiveRuntime(process.env.BETA_ARCHIVE);
          try {
            assert.equal(runtime.archiveSHA256,'4736a6477712e66d5a4166926e114edc765a464664839a3840d57323f964ce94');
            assert.equal(runtime.manifest.sourceCommit,'e8542ccb79752d0e3869273ba09f91aa3158a0ae');
            assert.equal(runtime.manifest.sourceTag,'v1.1.1');
            await mkdir('results/fixed-archive',{recursive:true});
            await writeFile('results/fixed-archive/identity.json',JSON.stringify({archiveSHA256:runtime.archiveSHA256,sourceCommit:runtime.manifest.sourceCommit,harnessRevision:await readFile(process.env.RUNNER_TEMP+'/harness-revision.txt','utf8'),consumerHarnessSHA256:createHash('sha256').update(await readFile('tests/public-api-consumer.mjs')).digest('hex'),platform:process.platform},null,2));
          } finally {await runtime.cleanup();}
          JS
      - name: Apply diagnostic startup modules
        run: |
          python3 - <<'PY'
          import pathlib,tarfile,json,hashlib,io,base64
          archive=pathlib.Path('build/release/demuxe-1.1.1.tgz');pathlib.Path('build/release/demuxe-parent.tgz').write_bytes(archive.read_bytes());parent=hashlib.sha256(archive.read_bytes()).hexdigest();assert parent=='4736a6477712e66d5a4166926e114edc765a464664839a3840d57323f964ce94'
          replacements={name:base64.b64decode(value) for name,value in {'package/web/generated/internal/machine/native-backend.js': '', 'package/web/generated/unified-player.js': ''}.items()}
          with tarfile.open(archive) as tar:
              manifest=json.load(tar.extractfile('package/release-manifest.json'))
              for name,data in replacements.items():
                  original=tar.extractfile(name).read();entry=manifest['files'][name.removeprefix('package/')];assert hashlib.sha256(original).hexdigest()==entry['sha256'];assert len(original)==entry['bytes']
                  manifest['files'][name.removeprefix('package/')]={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
              manifest['dirtySource']=True;manifest['sourceTag']=None;manifest['publicationEligible']=False;manifest['diagnosticOverlay']={'parentArchiveSHA256':parent,'files':{name:hashlib.sha256(data).hexdigest() for name,data in replacements.items()}}
              target=archive.with_suffix('.diagnostic.tgz')
              with tarfile.open(target,'w:gz') as output:
                  for member in tar:
                      data=tar.extractfile(member).read() if member.isfile() else None
                      if member.name in replacements:data=replacements[member.name]
                      if member.name=='package/release-manifest.json':data=(json.dumps(manifest,indent=2)+'\n').encode()
                      if data is not None:member.size=len(data)
                      output.addfile(member,io.BytesIO(data) if data is not None else None)
          target.replace(archive)
          pathlib.Path('results/fixed-archive/diagnostic-overlay.json').write_text(json.dumps({'parentArchiveSHA256':parent,'archiveSHA256':hashlib.sha256(archive.read_bytes()).hexdigest(),'files':manifest['diagnosticOverlay']['files'],'publicationEligible':False},indent=2)+'\n')
          print('Derived diagnostic archive with two generated startup modules; not publishable')
          PY
      - name: Prepare complete Linux release fixtures
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/prepare-release-fixtures.py
      - name: Prepare Apple WebKit API fixtures
        if: matrix.os == 'macos-15'
        run: node tests/api-stability/fixtures.mjs
      - name: Capture the selected playback surface before testing expansion
        run: |
          python3 - <<'PY'
          import pathlib,base64,hashlib
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='dd43aa28cf2c66a0ccffddb5569b6ed2092dfec509bdbdb68425c169558931c6'
          pathlib.Path('tests/player-mobile.mjs').write_bytes(data)
          PY
      - name: Repeat mobile controls and expansion on the diagnostic archive
        run: |
          BROWSER=webkit node tests/player-mobile.mjs
          BROWSER=webkit node tests/player-mobile.mjs
          BROWSER=webkit node tests/player-mobile.mjs
      - name: Repeat Chrome mobile controls and expansion
        if: matrix.gate == 'matrix'
        run: |
          BROWSER=chrome node tests/player-mobile.mjs
          BROWSER=chrome node tests/player-mobile.mjs
      - name: Verify all installed archive API and mobile shards
        if: matrix.gate == 'matrix'
        run: node tests/api-stability/archive-matrix.mjs
      - name: Verify Apple WebKit API, component, boundaries, containment and mobile
        if: matrix.gate == 'webkit'
        run: node tests/webkit-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-startup-browser-gates-${{ matrix.gate }}
          path: |
            results/fixed-archive/
            results/passive-retirement/
            results/release-extra/
            results/public-api-consumer/
            results/public-api/
            results/player-component/
            results/player-menu-review/
            results/api-stability/
            results/player-mobile/
            results/webkit-release/
            results/worker-tree-containment/
