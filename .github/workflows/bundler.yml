# SPDX-License-Identifier: Apache-2.0
name: Provider bundle loader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-worklet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps firefox
      - run: |
          sudo apt-get install -y pulseaudio
          bash scripts/start-ci-audio.sh
      - name: Isolate actual production worklet through 80 active navigation cycles
        run: node tests/firefox-worklet-navigation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-isolated-worklet-navigation
          path: results/firefox-worklet-navigation/
