# SPDX-License-Identifier: Apache-2.0
name: Tagged player demo and npm release

on:
  push:
    tags: ['**', '!modular-*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild, or the proposed tag for qualification only
        required: true
        type: string
      qualify_only:
        description: Run all release gates and retain artifacts without publishing or deploying
        type: boolean
        default: false
      source_ref:
        description: Exact source commit for candidate qualification or retained-archive replay
        type: string
        default: ''
      replay_ass_run:
        description: Diagnostic only - repository run containing unqualified-runtime-debug (skips all builds/publication)
        type: string
        default: ''
      replay_ass_sha256:
        description: Expected runtime archive SHA256 for diagnostic replay
        type: string
        default: ''
      replay_ass_overlay:
        description: Diagnostic only - overlay reviewed MSE modules on a private installed copy
        type: boolean
        default: false
      replay_ass_rounds:
        description: Independent main ASS trials (1 to 10; every failure is retained)
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: tag-release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  qualification-pending:
    if: inputs.qualify_only && !inputs.replay_ass_run
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Show complete candidate qualification on its source commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.source_ref }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_COMMIT" \
            -f state=pending -f context='Release candidate qualification' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Exact archive and macOS WebKit qualification running'

  qualification-result:
    if: always() && inputs.qualify_only && !inputs.replay_ass_run
    needs: [qualification-pending, providers, build, webkit]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report all qualification gates together
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.source_ref }}
          PENDING_RESULT: ${{ needs.qualification-pending.result }}
          PROVIDER_RESULT: ${{ needs.providers.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          qualification_state=failure
          if [[ "$PENDING_RESULT" == success && "$PROVIDER_RESULT" == success && "$BUILD_RESULT" == success && "$WEBKIT_RESULT" == success ]]; then
            qualification_state=success
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_COMMIT" \
            -f state="$qualification_state" -f context='Release candidate qualification' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Complete candidate qualification result'

  providers:
    if: (github.event_name == 'workflow_dispatch' || github.event.created == true) && !inputs.replay_ass_run
    uses: ./.github/workflows/ci-providers.yml
    with:
      source_ref: ${{ inputs.qualify_only && inputs.source_ref || format('refs/tags/{0}', inputs.tag || github.ref_name) }}

  ass-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.replay_ass_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      BROWSER: ${{ matrix.browser }}
      REPLAY_SOURCE_COMMIT: ${{ inputs.source_ref }}
      REPLAY_ARCHIVE_SHA256: ${{ inputs.replay_ass_sha256 }}
      REPLAY_CONTROLLER_OVERLAY: ${{ inputs.replay_ass_overlay && '1' || '' }}
      REPLAY_ASS_ROUNDS: ${{ inputs.replay_ass_rounds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install fixture tools and start the release audio clock
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio xvfb fonts-dejavu-core
          bash scripts/start-ci-audio.sh
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: ${{ runner.temp }}/ass-replay
          run-id: ${{ inputs.replay_ass_run }}
          github-token: ${{ github.token }}
      - name: Prepare the maintained release fixture recipes
        run: python3 scripts/prepare-release-fixtures.py
      - name: Replay ASS and native-remux consumer suites on verified retained bytes
        run: |
          BETA_ARCHIVE="$RUNNER_TEMP/ass-replay/demuxe-$(node -p 'require("./package.json").version').tgz"
          export BETA_ARCHIVE
          xvfb-run -a node tests/replay-ass-archive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ass-replay-${{ matrix.browser }}
          path: |
            results/ass-archive-replay/
            results/beta/
            results/optimization-completion/
            results/optimization-ass-fixes/
            build/release-fixture-recipes.json
          if-no-files-found: error

  ass-replay-result:
    if: always() && inputs.replay_ass_run != ''
    needs: ass-replay
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report diagnostic replay result on its harness commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_RESULT: ${{ needs.ass-replay.result }}
        run: |
          replay_state=failure
          if [[ "$REPLAY_RESULT" == success ]]; then replay_state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$replay_state" -f context='ASS archive replay' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Retained-archive ASS diagnostic result; not release qualification'

  build:
    if: (github.event_name == 'workflow_dispatch' || github.event.created == true) && !inputs.replay_ass_run
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEMUXE_SDK: ${{ github.workspace }}/build/emsdk-4.0.14
      DEMUXE_JOBS: '4'
      PAGES_TAG: ${{ inputs.tag || github.ref_name }}
      PAGES_EXPECT_TAG: ${{ inputs.tag || github.ref_name }}
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.qualify_only && inputs.source_ref || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the unpublished candidate tag to the exact source commit
        if: inputs.qualify_only
        env:
          CANDIDATE_COMMIT: ${{ inputs.source_ref }}
        run: python3 scripts/prepare-release-candidate.py --tag "$PAGES_TAG" --commit "$CANDIDATE_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config make gcc g++ patch ffmpeg pulseaudio xvfb fonts-dejavu-core
          python3 -m venv build/venv
          build/venv/bin/python -m pip install meson==1.7.2 Jinja2==3.1.6 MarkupSafe==3.0.2
          npm ci --ignore-scripts
          npm run prepare:shaka
      - name: Check release browser contracts before building
        run: node --test tests/release-browser-contracts.test.mjs tests/head-to-head/browser-exit.test.mjs
      - name: Download and verify the published comparison baseline
        if: github.event_name == 'push' || inputs.qualify_only
        run: python3 scripts/tag-release.py baseline
      - name: Check Pages assembly and tag guards
        run: |
          python3 tests/pages-build.py
          python3 tests/tag-release.py
          python3 tests/release-candidate.py
          node --test tests/head-to-head/completion.test.mjs tests/head-to-head/playback-rate.test.mjs tests/beta-consumer-startup.mjs tests/shaka-package-evidence.test.mjs
          python3 tests/release-boundaries.py
          python3 tests/lgpl-catalogue.py
          python3 tests/npm-release.py
          python3 tests/github-release.py
      - name: Install the locked Emscripten SDK
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          pin = next(x for x in json.loads(pathlib.Path('sources.lock.json').read_text())['sources'] if x['name'] == 'emsdk')
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'emsdk.tar.gz'
          subprocess.run(['curl', '-fL', '--retry', '3', pin['url'], '-o', str(archive)], check=True)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != pin['sha256']:
              raise SystemExit('Emscripten installer archive hash mismatch')
          sdk = pathlib.Path(os.environ['DEMUXE_SDK'])
          sdk.mkdir()
          subprocess.run(['tar', '-xf', str(archive), '--strip-components=1', '-C', str(sdk)], check=True)
          PY
          "$DEMUXE_SDK/emsdk" install 4.0.14
          "$DEMUXE_SDK/emsdk" activate 4.0.14
      - name: Install test browsers
        run: npx playwright install --with-deps chromium chrome firefox webkit
      - name: Install the independently pinned Linux WebKit media target
        run: |
          npm install --prefix "$RUNNER_TEMP/demuxe-linux-webkit" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/.bin/playwright" install --with-deps webkit
          printf 'DEMUXE_WEBKIT_TEST_MODULE=%s\n' "$RUNNER_TEMP/demuxe-linux-webkit/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Verify every release browser can launch before compiling engines
        run: |
          node --input-type=module <<'JS'
          import * as current from 'playwright';
          import {webkit as linuxMediaWebKit, testBrowserRuntime} from './tests/browser-test-runtime.mjs';
          for (const [name, type, options] of [
            ['chromium', current.chromium, {}],
            ['chrome', current.chromium, {channel: 'chrome'}],
            ['firefox', current.firefox, {}],
            ['webkit-menu', current.webkit, {}],
            ['webkit-linux-media', linuxMediaWebKit, {}],
          ]) {
            const browser = await type.launch({headless: true, ...options});
            console.log(name, browser.version(), testBrowserRuntime);
            await browser.close();
          }
          JS
      - name: Build all playback engines from the tag
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-beta-engines.sh --clean 2>&1 | tee build/clean-build.log
      - name: Build optional preparation engine and tagged release archives
        if: github.event_name == 'push' || inputs.qualify_only
        run: python3 scripts/tag-release.py package --tag "$PAGES_TAG"
      - name: Assemble the current player and matching source downloads
        run: python3 scripts/build-pages.py --tag "$PAGES_TAG" --output build/pages-site
      - name: Start audio service for playback checks
        run: bash scripts/start-ci-audio.sh
      - name: Verify Chrome-family playback and record timings
        env:
          BROWSER: chromium
        run: node tests/pages-demo.mjs
      - name: Verify Firefox playback and record timings
        env:
          BROWSER: firefox
        run: node tests/pages-demo.mjs
      - name: Generate fixtures and qualify the exact release archives
        if: github.event_name == 'push' || inputs.qualify_only
        run: xvfb-run -a python3 scripts/tag-release.py qualify --tag "$PAGES_TAG"
      - name: Qualify the API and mobile player matrix on the installed archive
        if: github.event_name == 'push' || inputs.qualify_only
        run: |
          BETA_ARCHIVE="$PWD/build/release/demuxe-$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version').tgz"
          export BETA_ARCHIVE
          node tests/api-stability/archive-matrix.mjs
      - name: Retain qualified release archives
        if: github.event_name == 'push' || inputs.qualify_only
        uses: actions/upload-artifact@v4
        with:
          name: qualified-release
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
      - name: Retain build and playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-build-evidence
          path: |
            build/clean-build.log
            build/pages-site/deployment-manifest.json
            results/pages/
            build/tag-release/catalogue-comparison.json
            build/tag-release/baseline/summary.json
            build/tag-release/candidate/summary.json
            build/tag-release/optional/qualification.json
            build/tag-release/optional/*.log
            build/tag-release/specialist-validation/*.json
            build/beta-build.json
            build/tag-release/specialist-validation/*/*.json
            build/tag-release/specialist-validation/*/*.framemd5
            build/tag-release/candidate-assets/specialist.json
            build/tag-release/candidate-assets/fixtures/specialist/commands.json
            results/optimization-final/tail-controller-*/result.json
            results/beta/
            results/shaka-package/
            results/release-extra/
            results/api-stability/
            results/public-api-consumer/
            results/public-api/
            results/player-component/
            results/player-menu-review/
            results/player-mobile/
            results/worker-tree-containment/
            results/optimization-completion/
            results/optimization-ass-fixes/
      - name: Retain unqualified runtime for failed release diagnosis
        if: failure() && (github.event_name == 'push' || inputs.qualify_only)
        uses: actions/upload-artifact@v4
        with:
          name: unqualified-runtime-debug
          path: build/release/*
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        if: '!inputs.qualify_only'
        with:
          path: build/pages-site

  webkit:
    if: github.event_name == 'push' || inputs.qualify_only
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.qualify_only && inputs.source_ref || format('refs/tags/{0}', github.ref_name) }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install webkit
      - run: command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: qualified-release
          path: build/release
      - name: Generate the browser API fixtures
        run: node tests/api-stability/fixtures.mjs
      - name: Qualify Apple WebKit against the exact installed release archive
        run: |
          BETA_ARCHIVE="$PWD/build/release/demuxe-$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version').tgz"
          export BETA_ARCHIVE
          node tests/webkit-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-macos-release-evidence
          path: results/webkit-release/
          if-no-files-found: error

  deploy:
    concurrency:
      group: github-pages
      cancel-in-progress: false
    needs: [build, webkit]
    if: always() && !inputs.qualify_only && needs.build.result == 'success' && (github.event_name != 'push' || needs.webkit.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish tested player
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [build, providers, webkit]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: qualified-release
          path: build/release
      - name: Publish qualified archives and source companions on GitHub
        run: |
          python3 scripts/publish-github-release.py --assets build/release \
            --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)" --repo "$GITHUB_REPOSITORY"

  stage-npm:
    needs: release
    if: always() && !startsWith(github.event.release.tag_name || github.ref_name, 'modular-') && ((github.event_name == 'push' && needs.release.result == 'success') || (github.event_name == 'release' && !github.event.release.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Test release handoff guards
        run: python3 tests/npm-release.py
      - name: Download qualified runtime and public source companions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/npm-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir build/npm-release \
            --pattern 'verification.json' --pattern '*.tgz' --pattern '*source*.tar.gz'
      - name: Validate and stage the exact verified archive as latest for npm approval
        run: |
          python3 scripts/publish-npm-release.py --assets build/npm-release \
            --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)" --stage
