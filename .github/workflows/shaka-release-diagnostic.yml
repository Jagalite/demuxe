# SPDX-License-Identifier: Apache-2.0
name: Installed release archive diagnostic
on:
  push:
    branches: [release-1.1.0-shaka-diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            src
            tests
            scripts
            fixtures
            examples
            experiments/optimization-integration
            licensing
            packages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: |
          sudo sed -i -E 's|^URIs:.*apt-mirrors.*|URIs: https://archive.ubuntu.com/ubuntu/|; s|^URIs:.*apt-security-mirrors.*|URIs: https://security.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          cat /etc/apt/sources.list.d/ubuntu.sources
      - run: sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg pulseaudio
      - run: npx playwright install --with-deps chrome
      - run: pulseaudio --start --exit-idle-time=-1
      - name: Download retained unqualified archive for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37676172217 --repo Jagalite/demuxe --name unqualified-runtime-debug --dir build/diagnostic-archive
      - name: Prepare synthetic release fixtures
        run: python3 scripts/prepare-release-fixtures.py
      - name: Observe first native startup and worker failures on the retained archive
        env:
          BETA_ARCHIVE: build/diagnostic-archive/demuxe-1.1.0.tgz
          HEADLESS: '1'
        run: |
          echo "DEFAULT AUDIO SINK CONTROL"
          pactl list short sinks
          for trial in 1 2 3; do
            echo "DEFAULT CONSUMER TRIAL $trial"
            BROWSER=chrome ONLY="static application at /assets/demuxe/" node tests/public-api-consumer.mjs || true
            echo "DEFAULT RAW CONTROL $trial"
            BROWSER=chrome RAW_NATIVE=1 ONLY="raw native" node tests/public-api-consumer.mjs || true
          done
          echo "50MS AUDIO SINK INTERVENTION"
          pactl load-module module-null-sink sink_name=demuxe_ci rate=48000 channels=2 norewinds=1
          pactl set-default-sink demuxe_ci
          pactl list short sinks
          pactl list sinks
          for trial in 1 2 3 4 5; do
            echo "50MS CONSUMER TRIAL $trial"
            BROWSER=chrome ONLY="static application at /assets/demuxe/" node tests/public-api-consumer.mjs || true
            echo "50MS RAW CONTROL $trial"
            BROWSER=chrome RAW_NATIVE=1 ONLY="raw native" node tests/public-api-consumer.mjs || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-startup-diagnostic
          path: |
            results/public-api-consumer
            results/public-api
