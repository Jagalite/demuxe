# SPDX-License-Identifier: Apache-2.0
name: Installed release archive diagnostic
on:
  push:
    branches: [release-1.1.0-shaka-diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio
      - run: npx playwright install --with-deps chromium chrome firefox webkit
      - run: pulseaudio --start --exit-idle-time=-1
      - name: Download retained unqualified archive for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37676172217 --repo Jagalite/demuxe --name unqualified-runtime-debug --dir build/diagnostic-archive
      - name: Prepare synthetic release fixtures
        run: python3 scripts/prepare-release-fixtures.py
      - name: Observe first native startup and worker failures on the retained archive
        env:
          BETA_ARCHIVE: build/diagnostic-archive/demuxe-1.1.0.tgz
          HEADLESS: '1'
        run: |
          pactl list short sinks
          for trial in 1 2 3 4 5; do
            echo "CONSUMER TRIAL $trial"
            BROWSER=chrome node tests/public-api-consumer.mjs || true
          done
          echo "PUBLIC API DIAGNOSTIC"
          mkdir -p build/diagnostic-runtime
          tar -xzf "$BETA_ARCHIVE" -C build/diagnostic-runtime --strip-components=1
          DEMUXE_RUNTIME_ROOT="$PWD/build/diagnostic-runtime" BROWSER=chrome node tests/public-api.mjs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-startup-diagnostic
          path: |
            results/public-api-consumer
            results/public-api
