# SPDX-License-Identifier: Apache-2.0
name: Installed release archive diagnostic
on:
  push:
    branches: [release-1.1.0-shaka-diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio
      - run: npx playwright install --with-deps chromium chrome firefox webkit
      - run: pulseaudio --start --exit-idle-time=-1
      - name: Download retained unqualified archive for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37665885140 --repo Jagalite/demuxe --name unqualified-runtime-debug --dir build/diagnostic-archive
      - name: Prepare synthetic release fixtures
        run: python3 scripts/prepare-release-fixtures.py
      - name: Preflight installed archive exports controls and browser boundaries
        env:
          BETA_ARCHIVE: build/diagnostic-archive/demuxe-1.1.0.tgz
          HEADLESS: '1'
        run: node tests/release-extra.mjs
      - name: Preflight the installed archive API and mobile matrix
        env:
          BETA_ARCHIVE: build/diagnostic-archive/demuxe-1.1.0.tgz
          HEADLESS: '1'
        run: node tests/api-stability/archive-matrix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-archive-diagnostic
          path: |
            results/release-extra
            results/api-stability
            results/public-api-consumer
