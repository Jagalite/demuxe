# SPDX-License-Identifier: Apache-2.0
name: Player navigation and preview regressions
on:
  push:
    branches: [fix/range-preview-admission]
  pull_request:
    paths:
      - 'src/player/**'
      - 'src/preview/**'
      - 'src/internal/machine/preview*'
      - 'src/internal/machine/scrubber*'
      - 'tests/*preview*'
      - 'tests/*navigation*'
      - '.github/workflows/player-preview-regressions.yml'
permissions:
  contents: read
concurrency:
  group: player-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record reproducible qualification inputs
        run: git archive --format=tar HEAD src tests scripts tsconfig.json package.json package-lock.json .github/workflows > qualification-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: player-preview-source
          path: qualification-source.tar
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Preview unit regressions
        run: node --test tests/preview.mjs tests/preview-facade.mjs tests/preview-pregeneration.mjs tests/preview-strategies.mjs tests/scrubber-preview.mjs tests/preview-range.mjs
